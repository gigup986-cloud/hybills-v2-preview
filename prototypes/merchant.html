<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Hybills Merchant</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet"><style>/* HyBills shared design tokens
   APPROXIMATION: values derived from the supplied mockup/brief (teal/cyan, dark, Plus Jakarta Sans).
   They are NOT verified against the HyBills website source. Replace this file's :root block
   with the website's real tokens when the authoritative source is available. */
:root{
  --hb-bg:#041219;
  --hb-bg-2:#071c26;
  --hb-surface:#0b2531;
  --hb-surface-2:#10303f;
  --hb-surface-3:#16414f;
  --hb-border:rgba(110,225,235,.14);
  --hb-border-strong:rgba(110,225,235,.28);
  --hb-cyan:#22d3ee;
  --hb-cyan-2:#67e8f9;
  --hb-teal:#14b8a6;
  --hb-green:#34d399;
  --hb-amber:#fbbf24;
  --hb-red:#fb7185;
  --hb-text:#e9fbff;
  --hb-muted:#8db3be;
  --hb-faint:#5d8591;
  --hb-grad:linear-gradient(135deg,#22d3ee 0%,#14b8a6 100%);
  --hb-grad-soft:linear-gradient(160deg,rgba(34,211,238,.18),rgba(20,184,166,.06));
  --hb-r-sm:10px; --hb-r-md:14px; --hb-r-lg:20px; --hb-r-xl:28px; --hb-r-pill:999px;
  --hb-shadow:0 10px 30px rgba(0,0,0,.35);
  --hb-glow:0 0 0 1px rgba(34,211,238,.35),0 8px 28px rgba(34,211,238,.22);
  --hb-font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-8:32px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#020a0f;font-family:var(--hb-font);color:var(--hb-text)}
body{display:flex;align-items:center;justify-content:center}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.phone{position:relative;width:100%;height:100%;max-width:100vw;background:var(--hb-bg);overflow:hidden;display:flex;flex-direction:column}
@media(min-width:520px){
  .phone{width:390px;height:min(844px,100vh - 24px);border-radius:44px;border:1px solid var(--hb-border-strong);box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 8px #07161e}
}
.phone::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 60% at 50% -10%,rgba(34,211,238,.16),transparent 60%);pointer-events:none;z-index:0}
.statusbar{height:34px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 22px 0;font-size:12px;font-weight:700;z-index:2;position:relative}
.statusbar .sb-r{display:flex;gap:5px;align-items:center;opacity:.9}
#view{flex:1;position:relative;overflow-y:auto;overflow-x:hidden;z-index:1;scrollbar-width:none}
#view::-webkit-scrollbar{display:none}
.screen{min-height:100%;padding:0 var(--sp-5) 28px;animation:scr .28s ease both}
@keyframes scr{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.screen.back{animation-name:scrb}
@keyframes scrb{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
/* header */
.hdr{display:flex;align-items:center;gap:var(--sp-3);padding:6px 0 var(--sp-4);position:sticky;top:0;z-index:3;background:linear-gradient(var(--hb-bg) 70%,transparent)}
.hdr h1{font-size:19px;font-weight:800;flex:1;letter-spacing:-.2px}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--hb-surface);border:1px solid var(--hb-border);position:relative;flex:none;transition:transform .12s,background .15s}
.iconbtn:active{transform:scale(.92)}
.iconbtn .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--hb-red);border:2px solid var(--hb-surface)}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* typography */
.h2{font-size:16px;font-weight:800;margin:var(--sp-5) 0 var(--sp-3);display:flex;align-items:center;justify-content:space-between}
.h2 a,.link{font-size:12.5px;font-weight:700;color:var(--hb-cyan);cursor:pointer}
.muted{color:var(--hb-muted)}.faint{color:var(--hb-faint)}.sm{font-size:12.5px}.xs{font-size:11px}
.tag-unv{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.4px;color:var(--hb-amber);background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.35);padding:2px 7px;border-radius:var(--hb-r-pill);text-transform:uppercase}
.tag-demo{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.4px;color:var(--hb-cyan);background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.3);padding:2px 7px;border-radius:var(--hb-r-pill);text-transform:uppercase}
/* cards */
.card{background:var(--hb-surface);border:1px solid var(--hb-border);border-radius:var(--hb-r-lg);padding:var(--sp-4)}
.card.tap{cursor:pointer;transition:transform .12s,border-color .15s}.card.tap:active{transform:scale(.985)}.card.tap:hover{border-color:var(--hb-border-strong)}
.hero{background:var(--hb-grad);color:#032028;border-radius:var(--hb-r-xl);padding:var(--sp-5);position:relative;overflow:hidden;box-shadow:var(--hb-glow)}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.18)}
.hero .lbl{font-size:12px;font-weight:700;opacity:.75}
.hero .amt{font-size:30px;font-weight:800;letter-spacing:-.6px;margin:4px 0 12px}
.hero .btn{background:#03242d;color:var(--hb-cyan-2);padding:9px 16px;font-size:13px}
.stat{background:var(--hb-surface);border:1px solid var(--hb-border);border-radius:var(--hb-r-md);padding:var(--sp-3) var(--sp-4)}
.stat b{display:block;font-size:19px;font-weight:800;margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp-3)}
.svc{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11.5px;font-weight:700;padding:12px 4px;border-radius:var(--hb-r-md);background:var(--hb-surface);border:1px solid var(--hb-border);transition:transform .12s,border-color .15s}
.svc:active{transform:scale(.94)}.svc:hover{border-color:var(--hb-border-strong)}
.svc .ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--hb-grad-soft);color:var(--hb-cyan);border:1px solid var(--hb-border)}
.row{display:flex;align-items:center;gap:var(--sp-3)}
.row.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:var(--sp-3)}
.grow{flex:1;min-width:0}
.li{display:flex;align-items:center;gap:var(--sp-3);padding:12px 0;border-bottom:1px solid var(--hb-border);cursor:pointer}
.li:last-child{border-bottom:0}
.li .ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--hb-surface-2);color:var(--hb-cyan);flex:none}
.li .t{font-weight:700;font-size:14px}.li .s{font-size:12px;color:var(--hb-muted);margin-top:2px}
.li .r{text-align:right;font-weight:800;font-size:14px}.li .r small{display:block;font-weight:600;font-size:11px;color:var(--hb-muted);margin-top:2px}
.pos{color:var(--hb-green)}.neg{color:var(--hb-text)}.warn{color:var(--hb-amber)}.err{color:var(--hb-red)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;border-radius:var(--hb-r-md);font-weight:800;font-size:15px;background:var(--hb-grad);color:#032028;box-shadow:0 6px 20px rgba(34,211,238,.25);transition:transform .12s,box-shadow .15s,opacity .15s}
.btn:active,.btn.pressed{transform:scale(.95);box-shadow:0 2px 8px rgba(34,211,238,.2)}
.btn.block{width:100%}
.btn.ghost{background:var(--hb-surface);color:var(--hb-text);border:1px solid var(--hb-border-strong);box-shadow:none}
.btn.danger{background:rgba(251,113,133,.14);color:var(--hb-red);border:1px solid rgba(251,113,133,.4);box-shadow:none}
.btn.sm{padding:9px 14px;font-size:13px;border-radius:12px}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn .spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(3,32,40,.25);border-top-color:#032028;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* inputs */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:var(--sp-3)}
.field label{font-size:12px;font-weight:700;color:var(--hb-muted)}
.inp{display:flex;align-items:center;gap:10px;background:var(--hb-surface);border:1px solid var(--hb-border);border-radius:var(--hb-r-md);padding:0 14px;transition:border-color .15s,box-shadow .15s}
.inp:focus-within{border-color:var(--hb-cyan);box-shadow:0 0 0 3px rgba(34,211,238,.15)}
.inp input,.inp select,.inp textarea{flex:1;min-width:0;background:none;border:0;outline:0;padding:14px 0;font-size:14.5px;font-weight:600}
.inp select option{background:var(--hb-surface);color:var(--hb-text)}
.inp .ic{color:var(--hb-faint)}
.field.bad .inp{border-color:var(--hb-red)}
.field .msg{font-size:11.5px;color:var(--hb-red);display:none;font-weight:600}
.field.bad .msg{display:block}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:var(--hb-r-pill);background:var(--hb-surface);border:1px solid var(--hb-border);font-size:12.5px;font-weight:700;color:var(--hb-muted);transition:all .15s}
.chip.on{background:var(--hb-grad);color:#032028;border-color:transparent}
.seg{display:flex;background:var(--hb-surface);border:1px solid var(--hb-border);border-radius:var(--hb-r-md);padding:4px;gap:4px}
.seg button{flex:1;padding:9px;border-radius:11px;font-size:13px;font-weight:700;color:var(--hb-muted);transition:all .15s}
.seg button.on{background:var(--hb-grad);color:#032028}
.amtgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.amtgrid button{padding:12px 0;border-radius:var(--hb-r-md);background:var(--hb-surface);border:1px solid var(--hb-border);font-weight:800;font-size:14px;transition:all .15s}
.amtgrid button.on{border-color:var(--hb-cyan);background:rgba(34,211,238,.14);color:var(--hb-cyan-2);box-shadow:0 0 0 3px rgba(34,211,238,.12)}
.netrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.net{padding:12px 4px;border-radius:var(--hb-r-md);background:var(--hb-surface);border:1px solid var(--hb-border);font-weight:800;font-size:12.5px;text-align:center;transition:all .15s}
.net.on{border-color:var(--hb-cyan);background:rgba(34,211,238,.14)}
.net i{display:block;width:26px;height:26px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font-style:normal;font-size:11px;color:#032028}
.badge{display:inline-block;padding:3px 9px;border-radius:var(--hb-r-pill);font-size:10.5px;font-weight:800;background:var(--hb-surface-3);color:var(--hb-cyan-2)}
.badge.ok{background:rgba(52,211,153,.15);color:var(--hb-green)}
.badge.warn{background:rgba(251,191,36,.15);color:var(--hb-amber)}
.badge.err{background:rgba(251,113,133,.15);color:var(--hb-red)}
/* tab bar */
.tabbar{flex:none;display:flex;justify-content:space-around;padding:8px 6px 14px;background:rgba(5,24,33,.92);backdrop-filter:blur(14px);border-top:1px solid var(--hb-border);z-index:5;position:relative}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:700;color:var(--hb-faint);padding:4px 10px;border-radius:12px;min-width:56px;transition:color .15s}
.tab.on{color:var(--hb-cyan)}
.tab.on .ic{filter:drop-shadow(0 0 6px rgba(34,211,238,.6))}
/* breakdown */
.bk{display:flex;flex-direction:column;gap:10px}
.bk .r{display:flex;justify-content:space-between;font-size:13.5px;gap:12px}
.bk .r span:first-child{color:var(--hb-muted)}.bk .r b{font-weight:800;text-align:right}
.bk .tot{border-top:1px dashed var(--hb-border-strong);padding-top:12px;font-size:16px}
.bk .tot span:first-child{color:var(--hb-text);font-weight:800}
/* sheet + toast */
.scrim{position:absolute;inset:0;background:rgba(1,8,12,.6);z-index:20;animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--hb-bg-2);border-top:1px solid var(--hb-border-strong);border-radius:26px 26px 0 0;padding:10px var(--sp-5) 26px;z-index:21;max-height:85%;overflow:auto;animation:up .28s cubic-bezier(.2,.9,.3,1)}
.sheet .grab{width:42px;height:4px;border-radius:4px;background:var(--hb-border-strong);margin:0 auto 14px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toast{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);background:var(--hb-surface-3);border:1px solid var(--hb-border-strong);padding:11px 16px;border-radius:var(--hb-r-pill);font-size:13px;font-weight:700;z-index:40;box-shadow:var(--hb-shadow);animation:up .25s,fade .25s;max-width:88%;text-align:center}
/* states */
.skel{border-radius:12px;background:linear-gradient(90deg,var(--hb-surface) 25%,var(--hb-surface-2) 50%,var(--hb-surface) 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.empty,.errstate{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:44px 20px;color:var(--hb-muted)}
.empty .big,.errstate .big{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--hb-surface);border:1px solid var(--hb-border)}
.errstate .big{color:var(--hb-red);background:rgba(251,113,133,.1)}
.empty b,.errstate b{color:var(--hb-text);font-size:15px}
.toggle{width:46px;height:27px;border-radius:20px;background:var(--hb-surface-3);position:relative;transition:background .2s;flex:none;border:1px solid var(--hb-border)}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:#cfeef5;transition:transform .2s}
.toggle.on{background:var(--hb-teal)}.toggle.on::after{transform:translateX(19px)}
.logo{display:inline-block}
.splash{height:100%;min-height:640px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;animation:fade .4s}
.splash .logo{animation:pop .9s cubic-bezier(.2,1.4,.4,1) both,glow 2.2s ease-in-out infinite .9s}
.splash h1{font-size:36px;font-weight:800;letter-spacing:-1px}
.splash .tagline{color:var(--hb-muted);font-size:14px;font-weight:600}
.splash .bar{width:120px;height:3px;border-radius:3px;background:var(--hb-surface-2);overflow:hidden;margin-top:20px}
.splash .bar i{display:block;height:100%;width:0;background:var(--hb-grad);animation:fill 2.2s ease forwards}
@keyframes fill{to{width:100%}}
@keyframes pop{from{transform:scale(.3) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
@keyframes glow{50%{filter:drop-shadow(0 0 22px rgba(34,211,238,.7))}}
/* chat */
.msg-b{max-width:82%;padding:11px 14px;border-radius:18px;font-size:13.5px;line-height:1.45;animation:fade .25s}
.msg-b.bot{background:var(--hb-surface);border:1px solid var(--hb-border);border-bottom-left-radius:6px;align-self:flex-start}
.msg-b.me{background:var(--hb-grad);color:#032028;font-weight:600;border-bottom-right-radius:6px;align-self:flex-end}
/* chart */
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;font-size:10px;color:var(--hb-muted)}
.bars .b i{display:block;width:100%;border-radius:8px 8px 3px 3px;background:var(--hb-grad);min-height:4px;transform-origin:bottom;animation:grow .6s ease both}
@keyframes grow{from{transform:scaleY(0)}}
/* Motion Feedback — HyBills success celebration (original design) */
.mf{position:absolute;inset:0;z-index:60;background:radial-gradient(100% 70% at 50% 28%,#0b3a46 0%,#041219 70%);display:flex;flex-direction:column;align-items:center;padding:70px 26px 28px;animation:fade .25s;overflow:hidden}
.mf-stage{position:relative;width:200px;height:200px;display:grid;place-items:center;flex:none}
.mf-ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--hb-cyan);opacity:0;animation:ring 1.6s ease-out forwards}
.mf-ring.r2{animation-delay:.2s;border-color:var(--hb-green)}.mf-ring.r3{animation-delay:.4s;border-color:var(--hb-cyan-2)}
@keyframes ring{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.mf-core{position:relative;width:104px;height:104px;border-radius:50%;background:var(--hb-grad);display:grid;place-items:center;box-shadow:0 0 50px rgba(34,211,238,.55);animation:pop .7s cubic-bezier(.2,1.5,.4,1) both .1s}
.mf-orbit{position:absolute;inset:20px;transform:rotate(-90deg)}
.mf-orbit circle{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-dasharray:420;stroke-dashoffset:420;animation:draw 1s ease forwards .15s;opacity:.9}
@keyframes draw{to{stroke-dashoffset:0}}
.mf-check{position:absolute;right:-4px;bottom:-4px;width:36px;height:36px;border-radius:50%;background:var(--hb-green);display:grid;place-items:center;color:#032028;border:3px solid var(--hb-bg);animation:pop .5s cubic-bezier(.2,1.6,.4,1) both .75s}
.mf-p{position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px;background:var(--c);border-radius:var(--rd,50%);opacity:0;animation:burst 1.5s cubic-bezier(.15,.8,.3,1) forwards var(--dl,.35s)}
@keyframes burst{0%{opacity:1;transform:rotate(var(--a)) translateX(30px) scale(.4)}70%{opacity:1}100%{opacity:0;transform:rotate(var(--a)) translateX(var(--d)) rotate(var(--sp,200deg)) scale(1)}}
.mf h2{font-size:24px;font-weight:800;margin-top:22px;animation:rise .5s both .55s}
.mf .mf-amt{font-size:38px;font-weight:800;letter-spacing:-1px;margin:6px 0 18px;background:var(--hb-grad);-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise .5s both .65s}
.mf dl{width:100%;background:var(--hb-surface);border:1px solid var(--hb-border);border-radius:var(--hb-r-lg);padding:6px 16px;animation:rise .5s both .75s}
.mf dl div{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--hb-border);font-size:13px}
.mf dl div:last-child{border:0}.mf dt{color:var(--hb-muted)}.mf dd{font-weight:800;text-align:right}
.mf .mf-actions{margin-top:auto;width:100%;display:flex;flex-direction:column;gap:10px;animation:rise .5s both .9s}
.mf .mf-timer{height:3px;border-radius:3px;background:var(--hb-surface-2);overflow:hidden}
.mf .mf-timer i{display:block;height:100%;width:100%;background:var(--hb-grad);transform-origin:left;animation:shrink var(--dur,6s) linear forwards}
@keyframes shrink{to{transform:scaleX(0)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.mf-p,.mf-ring{display:none}*{animation-duration:.01ms!important}}
</style></head><body><script>/* HyBills DEMO DATA — isolated from any production data.
   All catalogue prices below are DEMO placeholders, not HyBills pricing. */
const DEMO = {
  networks: [
    { id: 'mtn', name: 'MTN', color: '#fbbf24' },
    { id: 'airtel', name: 'Airtel', color: '#fb7185' },
    { id: 'glo', name: 'Glo', color: '#34d399' },
    { id: '9mobile', name: '9mobile', color: '#a3e635' },
  ],
  airtimeAmounts: [100, 200, 500, 1000, 2000, 5000],
  dataPlans: [
    { id: 'd1', size: '500MB', days: '7 days', price: 500 },
    { id: 'd2', size: '1GB', days: '30 days', price: 1000 },
    { id: 'd3', size: '2GB', days: '30 days', price: 1500 },
    { id: 'd4', size: '5GB', days: '30 days', price: 3000 },
    { id: 'd5', size: '10GB', days: '30 days', price: 5000 },
    { id: 'd6', size: '20GB', days: '30 days', price: 8500 },
  ],
  cities: ['Lagos', 'Abuja', 'Port Harcourt', 'Ibadan', 'Enugu', 'Kano', 'Aba', 'Owerri'],
  airports: [
    { code: 'LOS', name: 'Lagos (LOS)' }, { code: 'ABV', name: 'Abuja (ABV)' },
    { code: 'PHC', name: 'Port Harcourt (PHC)' }, { code: 'LHR', name: 'London (LHR)' },
    { code: 'ACC', name: 'Accra (ACC)' }, { code: 'DXB', name: 'Dubai (DXB)' },
  ],
  airlines: [
    { name: 'Air Peace', mult: 1 }, { name: 'Ibom Air', mult: 1.08 }, { name: 'Emirates', mult: 1.35 },

  W.empty = (icon, title, sub, cta) => `<div class="empty"><div class="big">${ic(icon, '')}</div><b>${esc(title)}</b><span class="sm">${esc(sub || '')}</span>${cta || ''}</div>`;
  W.errstate = (retry = 'retry') => `<div class="errstate"><div class="big">${ic('alert')}</div><b>Couldn't load this</b><span class="sm">Demo network error. Check your connection and try again.</span><button class="btn sm" data-act="${retry}">${ic('refresh')} Retry</button></div>`;
  W.skeleton = (n = 4) => Array.from({ length: n }, () => '<div class="row" style="padding:12px 0"><div class="skel" style="width:40px;height:40px"></div><div class="grow col" style="gap:7px"><div class="skel" style="height:12px;width:60%"></div><div class="skel" style="height:10px;width:35%"></div></div><div class="skel" style="height:14px;width:56px"></div></div>').join('');
  // load a list container with skeleton -> content or error (one-shot simulated error)
  W.loadInto = (sel, fn, ms = 420) => {
    const el = $(sel); if (!el) return;
    el.innerHTML = skeleton(4);
    const stamp = {}; el._s = stamp;
    setTimeout(() => {
      if (el._s !== stamp || !el.isConnected) return;
      if (S().simError) { S().simError = false; save(); el.innerHTML = errstate(); return; }
      el.innerHTML = fn();
    }, ms);
  };

  /* sheet / toast */
  W.sheet = (html) => { closeSheet(); const l = $('#layer'); l.insertAdjacentHTML('beforeend', `<div class="scrim" data-close></div><div class="sheet" role="dialog"><div class="grab"></div>${html}</div>`); };
  W.closeSheet = () => { $$('#layer .scrim,#layer .sheet').forEach(e => e.remove()); };
  W.toast = (msg) => { $$('#layer .toast').forEach(e => e.remove()); const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; $('#layer').appendChild(t); setTimeout(() => t.remove(), 2400); };

  /* actions registry + delegated events */
  W.ACT = {};
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-act],[data-go],[data-back],[data-tab],[data-close]');
    if (!t || !$('.phone').contains(t)) return;
    let p = {}; try { p = t.dataset.p ? JSON.parse(t.dataset.p) : {}; } catch (x) {}
    if (t.hasAttribute('data-close')) return closeSheet();
    if (t.hasAttribute('data-back')) return back();
    if (t.dataset.tab) return tab(t.dataset.tab);
    if (t.dataset.go) return nav(t.dataset.go, p);
    if (t.dataset.act) { const f = ACT[t.dataset.act]; if (f) f(p, t, e); else console.warn('no act', t.dataset.act); }
  });

  ACT.pick = (p, t) => { $$(`[data-group="${p.g}"]`).forEach(x => x.classList.remove('on')); t.classList.add('on'); App.ui[p.g] = p.v; if (App.ui._onpick) App.ui._onpick(p.g, p.v); };
  ACT.seg = (p, t) => { $$('button', t.parentElement).forEach(b => b.classList.remove('on')); t.classList.add('on'); App.ui[p.g] = p.v; if (App.ui._onpick) App.ui._onpick(p.g, p.v); };
  ACT.toggle = (p, t) => { t.classList.toggle('on'); };

  /* ---------- Motion Feedback: processing + HyBills celebration ---------- */
  // Tap Pay -> compress -> processing -> verification -> celebration (see celebrate)
  W.payFlow = async (btn, run, labels = {}) => {
    if (btn.dataset.busy) return; btn.dataset.busy = 1;
    const orig = btn.innerHTML;
    btn.classList.add('pressed'); try { navigator.vibrate && navigator.vibrate(12); } catch (e) {}
    await sleep(150); btn.classList.remove('pressed');
    btn.innerHTML = `<span class="spin"></span> ${labels.processing || 'Processing…'}`; btn.disabled = true;
    await sleep(1000);
    btn.innerHTML = `${ic('shield')} ${labels.verifying || 'Verifying payment…'}`;
    await sleep(800);
    let result;
    try { result = run(); } catch (err) { btn.innerHTML = orig; btn.disabled = false; delete btn.dataset.busy; throw err; }
    btn.innerHTML = `${ic('check')} Verified`;
    await sleep(300);
    delete btn.dataset.busy; btn.disabled = false; btn.innerHTML = orig;
    return result;
  };
  W.celebrate = (o) => {
    const dur = o.dur || 6000;
    const cols = ['#22d3ee', '#34d399', '#67e8f9', '#ffffff', '#14b8a6'];
    let ps = '';
    for (let i = 0; i < 26; i++) {
      const a = (i * 360 / 26 + Math.random() * 10).toFixed(1), d = (95 + Math.random() * 70).toFixed(0);
      ps += `<i class="mf-p" style="--a:${a}deg;--d:${d}px;--c:${cols[i % cols.length]};--dl:${(0.3 + Math.random() * 0.25).toFixed(2)}s;--sp:${(Math.random() * 360).toFixed(0)}deg;--rd:${i % 3 === 0 ? '2px' : '50%'}"></i>`;
    }
    const el = document.createElement('div'); el.className = 'mf'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', o.title || 'Payment Successful');
    el.innerHTML = `
      <button class="iconbtn" style="position:absolute;top:14px;right:14px" data-mf="close" aria-label="Dismiss">${ic('x')}</button>
      <div class="mf-stage"><div class="mf-ring"></div><div class="mf-ring r2"></div><div class="mf-ring r3"></div>${ps}
        <div class="mf-core">${logo(54, '#032028')}<svg class="mf-orbit" viewBox="0 0 144 144" width="64" height="64" style="inset:-20px;width:144px;height:144px"><circle cx="72" cy="72" r="66"/></svg><div class="mf-check">${ic('check')}</div></div></div>
      <h2>${esc(o.title || 'Payment Successful')}</h2>
      <div class="mf-amt">${esc(naira(o.amount))}</div>
      <dl>
        <div><dt>${esc(o.serviceLabel || 'Service')}</dt><dd>${esc(o.service)}</dd></div>
        <div><dt>${esc(o.refLabel || 'Reference')}</dt><dd>${esc(o.ref)}</dd></div>
        <div><dt>Status</dt><dd class="pos">${esc(o.status || 'Successful')}</dd></div>
      </dl>
      <div class="mf-actions">
        ${o.secondary ? `<button class="btn ghost block" data-mf="secondary">${esc(o.secondary.label)}</button>` : ''}
        <button class="btn block" data-mf="close">Done</button>
        <div class="mf-timer" style="--dur:${dur}ms"><i></i></div>
      </div>`;
    $('#layer').appendChild(el);
    let done = false;
    const close = (after) => { if (done) return; done = true; clearTimeout(tm); el.style.transition = 'opacity .25s'; el.style.opacity = 0; setTimeout(() => { el.remove(); after ? after() : (o.onDone && o.onDone()); }, 220); };
    const tm = setTimeout(() => close(), dur);
    el.addEventListener('click', e => { const b = e.target.closest('[data-mf]'); if (!b) return; e.stopPropagation(); if (b.dataset.mf === 'close') close(); else close(o.secondary.onClick); });
    return el;
  };

  /* ---------- boot ---------- */
  App.boot = (cfg) => {
    document.title = cfg.title;
    App.role = cfg.role; App.screens = cfg.screens; App.tabs = cfg.tabs;
    const sb = `<div class="statusbar"><span>9:41</span><span class="sb-r"><svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx=".8"/><rect x="4.5" y="5" width="3" height="6" rx=".8"/><rect x="9" y="2.5" width="3" height="8.5" rx=".8"/><rect x="13.5" y="0" width="3" height="11" rx=".8"/></svg><svg width="25" height="12" viewBox="0 0 25 12" fill="none" stroke="currentColor"><rect x=".5" y=".5" width="21" height="11" rx="3"/><rect x="2" y="2" width="15" height="8" rx="1.8" fill="currentColor" stroke="none"/><path d="M23 4v4" stroke-linecap="round"/></svg></span></div>`;
    document.body.innerHTML = `<div class="phone">${sb}<div id="view"></div><nav class="tabbar" id="tabbar" style="display:none">${cfg.tabs.map(t => `<button class="tab" data-tab="${t.id}" aria-label="${t.label}">${ic(t.icon)}<span>${t.label}</span></button>`).join('')}</nav><div id="layer"></div></div>`;
    App.stack = [{ name: cfg.start }]; draw('fwd');
  };
})();

/* HyBills shared form/UI helpers used by both apps */
(function () {

  ACT.step = (p) => { const v = Math.min(p.max, Math.max(p.min, (App.ui[p.g] || p.min) + p.d)); App.ui[p.g] = v; $('#st-' + p.g).textContent = v; };
  W.today = (d = 7) => new Date(Date.now() + d * 864e5).toISOString().slice(0, 10);
})();

</script><script>/* HyBills MERCHANT app screens (demo mode). Same design system + shared core as the Customer app. */

    mount: () => loadInto('#il', () => ACT.ifill(true) || $('#il').innerHTML, 380),
  };
  ACT.ifill = () => { const el = $('#il'); el.innerHTML = M().products.length ? M().products.map(p => `<div class="li" style="cursor:default"><div class="ico" style="font-size:22px">${p.emoji}</div><div class="grow"><div class="t">${esc(p.name)}</div><div class="s">${p.stock < 10 ? '<span class="badge warn">Low stock</span>' : '<span class="badge ok">In stock</span>'}</div></div><div class="row" style="gap:8px"><button class="iconbtn" style="width:30px;height:30px" data-act="stock" ${P({ id: p.id, d: -1 })}>${ic('minus')}</button><b id="s-${p.id}" style="min-width:26px;text-align:center">${p.stock}</b><button class="iconbtn" style="width:30px;height:30px" data-act="stock" ${P({ id: p.id, d: 1 })}>${ic('plus')}</button></div></div>`).join('') : empty('box', 'No inventory', 'Add products first.'); };
  ACT.stock = (p) => { const x = M().products.find(i => i.id === p.id); x.stock = Math.max(0, x.stock + p.d); save(); ACT.ifill(); };

  /* ---------------- customers ---------------- */
  screens.customers = {
    render: () => `${hdr('Customers')}${field('cq', '', 'search', '', 'text', 'placeholder="Search customers" oninput="ACT.cfill()"')}<div id="cl"></div>`,
    mount: () => loadInto('#cl', () => { ACT.cfill(); return $('#cl').innerHTML; }, 380),
  };
  const custAll = () => { const base = DEMO.merchantCustomers.map(c => ({ ...c })); M().orders.filter(o => o.fromCustomer).forEach(o => { let c = base.find(x => x.name === o.customer); if (!c) { c = { id: 'c-' + o.customer, name: o.customer, email: S().cust.email, phone: S().cust.profile.phone, orders: 0, spent: 0, last: 'Just now' }; base.unshift(c); } c.orders++; c.spent += o.total; c.last = 'Just now'; }); return base; };
  ACT.cfill = () => { const q = ($('#cq') ? $('#cq').value : '').toLowerCase(), el = $('#cl'); if (!el) return; const l = custAll().filter(c => c.name.toLowerCase().includes(q)); el.innerHTML = l.length ? l.map(c => `<div class="li" data-go="customerDetail" ${P({ id: c.id })}><div class="iconbtn" style="width:42px;height:42px;border-radius:50%;font-weight:800;color:var(--hb-cyan)">${esc(c.name[0])}</div><div class="grow"><div class="t">${esc(c.name)}</div><div class="s">${c.orders} orders · last ${esc(c.last)}</div></div><div class="r">${naira(c.spent)}</div></div>`).join('') : empty('users', 'No customers found', 'Try a different name.'); };
  screens.customerDetail = {
    render: (p) => { const c = custAll().find(x => x.id === p.id); if (!c) return hdr('Customer') + empty('users', 'Customer not found', ''); return `${hdr('Customer details')}<div class="card" style="text-align:center"><div class="iconbtn" style="width:64px;height:64px;border-radius:50%;margin:0 auto 10px;font-size:26px;font-weight:800;color:var(--hb-cyan)">${esc(c.name[0])}</div><b style="font-size:18px">${esc(c.name)}</b><div class="sm muted">${esc(c.email)}</div><div class="sm muted">${esc(c.phone)}</div></div><div class="grid2" style="margin-top:12px"><div class="stat"><span class="xs muted">Total orders</span><b>${c.orders}</b></div><div class="stat"><span class="xs muted">Total spent</span><b>${naira(c.spent)}</b></div></div><div class="card row between" style="margin-top:12px"><span class="muted sm">Last order</span><b>${esc(c.last)}</b></div><div class="col" style="margin-top:16px"><button class="btn block" data-go="orders" ${P({ customer: c.name })}>View orders</button><button class="btn ghost block" data-act="msgcust">${ic('chat')} Message customer</button></div>`; },
  };
  ACT.msgcust = () => toast('Demo: message composer would open');

  /* ---------------- wallet / earnings / settlement ---------------- */
  screens.wallet = {
    tab: 'wallet',
    render: () => `${hdr('Wallet & Earnings', { noBack: true })}<div class="card" style="background:var(--hb-grad-soft);border-color:var(--hb-border-strong)"><div class="xs muted">Available balance</div><div style="font-size:30px;font-weight:800;letter-spacing:-.6px;margin:4px 0 14px">${naira(M().wallet)}</div><div class="grid2"><button class="btn" data-act="withdraw">${ic('download')} Withdraw</button><button class="btn ghost" data-go="earnings">${ic('percent')} Earnings</button></div><div class="xs faint" style="margin-top:10px;text-align:center">Demo wallet · settlements are simulated</div></div>
      <div class="h2">Ledger</div><div id="ll"></div>`,
    mount: () => loadInto('#ll', () => ledger().length ? ledger().slice(0, 8).map(l => `<div class="li" style="cursor:default"><div class="ico">${ic(l.kind === 'credit' ? 'arrowDown' : 'arrowUp')}</div><div class="grow"><div class="t">${esc(l.title)}</div><div class="s">${esc(l.note || fmtTs(l.ts))}</div></div><div class="r ${l.kind === 'credit' ? 'pos' : ''}">${l.kind === 'credit' ? '+' : '-'}${naira(l.amt)}<small>${fmtTs(l.ts)}</small></div></div>`).join('') : empty('inbox', 'No ledger entries', 'Delivered orders and withdrawals appear here.'), 380),
  };
  ACT.withdraw = () => { App.ui.wamt = 0; sheet(`<h3 style="margin-bottom:4px">Withdraw to bank (demo)</h3><p class="muted sm" style="margin-bottom:14px">Available ${naira(M().wallet)}. Nothing real is transferred.</p>${select('bank', 'Destination', 'bank', ['Demo Bank •••• 4417', 'Demo Microfinance •••• 0092'], 'Demo Bank •••• 4417')}<div class="amtgrid" style="margin-bottom:12px">${[5000, 10000, 20000].map(a => `<button data-group="wamt" data-act="pick" ${P({ g: 'wamt', v: a })}>${naira(a)}</button>`).join('')}<button data-group="wamt" data-act="pick" ${P({ g: 'wamt', v: -1 })}>All</button></div>${field('wc', 'Or enter amount', 'tag', '', 'number', 'placeholder="Custom amount" oninput="App.ui.wamt=+this.value;$$(\'[data-group=wamt]\').forEach(x=>x.classList.remove(\'on\'))"')}<button class="btn block" data-act="wgo">Confirm withdrawal</button>`); };
  ACT.wgo = async (_, btn) => {
    clr(); let a = App.ui.wamt === -1 ? M().wallet : App.ui.wamt; if (!a || a < 1000) return bad('wc', 'Minimum ₦1,000'); if (a > M().wallet) return bad('wc', 'Exceeds available balance');
    const bank = $('#bank').value; let st;
    st = await payFlow(btn, () => { M().wallet -= a; const s = { id: 's' + Date.now(), ref: ref('STL'), amount: a, status: 'Processing', ts: new Date().toISOString() }; M().settlements.unshift(s); ledger().unshift({ id: 'l' + Date.now(), kind: 'debit', title: 'Withdrawal ' + s.ref, amt: a, ts: s.ts, note: bank }); save(); return s; }, { verifying: 'Confirming settlement…' });
    closeSheet(); celebrate({ title: 'Withdrawal Requested', amount: a, service: 'Settlement to ' + bank, serviceLabel: 'Destination', ref: st.ref, status: 'Processing (demo)', secondary: { label: 'View earnings', onClick: () => nav('earnings') }, onDone: () => rerender() });
  };
  screens.earnings = {
    render: () => { const all = live(), del = M().orders.filter(o => o.status === 'Delivered'), pend = all.filter(o => o.status !== 'Delivered'), c = commSum(), settled = M().settlements.filter(s => s.status === 'Settled').reduce((a, s) => a + s.amount, 0); return `${hdr('Earnings & Commission')}
      <div class="card"><div class="xs muted">Gross sales</div><div style="font-size:28px;font-weight:800;margin:4px 0">${naira(gross(all))}</div><div class="xs muted">${all.length} orders (excl. declined)</div></div>
      <div class="card bk" style="margin-top:12px"><div class="r"><span>Delivered</span><b>${naira(gross(del))}</b></div><div class="r"><span>Pending settlement (undelivered)</span><b>${naira(gross(pend))}</b></div><div class="r"><span>Settled to date</span><b>${naira(settled)}</b></div><div class="r"><span>Commission</span><b>${commCell(c)}</b></div><div class="r tot"><span>Net settlement</span><b>${c.status === 'UNVERIFIED' ? '<span class="tag-unv">Pending rules</span>' : naira(gross(all) - c.v) + ' <span class="tag-demo">Demo</span>'}</b></div></div>
      <div class="card" style="margin-top:12px;border-color:rgba(251,191,36,.3)"><span class="tag-unv">Commission rules — unverified</span><p class="xs muted" style="margin-top:8px">${c.status === 'UNVERIFIED' ? 'Real HyBills commission is not connected, so no commission or net figure is shown. Gross figures come from demo orders.' : 'Showing a clearly-labelled DEMO placeholder (flat 1%, deducted for the net figure as a demo assumption). Not HyBills rates.'}</p></div>
      <div class="h2">Settlement history</div>${M().settlements.length ? M().settlements.map(s => `<div class="li" style="cursor:default"><div class="ico">${ic('bank')}</div><div class="grow"><div class="t">${esc(s.ref)}</div><div class="s">${fmtTs(s.ts)}</div></div><div class="r">${naira(s.amount)}<small><span class="badge ${s.status === 'Settled' ? 'ok' : 'warn'}">${s.status}</span></small></div></div>`).join('') : empty('bank', 'No settlements yet', 'Withdraw from your wallet to create one.')}`; },
  };

  /* ---------------- analytics ---------------- */
  screens.analytics = {
    render: () => { App.ui.per = 'Week'; return `${hdr('Analytics')}<div class="seg" style="margin-bottom:14px">${['Week', 'Month', 'Year'].map(p => `<button class="${p === 'Week' ? 'on' : ''}" data-act="seg" ${P({ g: 'per', v: p })}>${p}</button>`).join('')}</div><div class="card"><div class="row between"><b>Sales trend</b><span class="tag-demo">Sample data</span></div><div id="ch"></div></div>
      <div class="h2">Orders by status (live)</div><div class="card bk">${['New', 'Processing', 'Ready', 'Delivered', 'Cancelled'].map(s => `<div class="r"><span>${s}</span><b>${M().orders.filter(o => o.status === s).length}</b></div>`).join('')}</div>`; },
    mount: () => { App.ui._onpick = () => ACT.chart(); ACT.chart(); },
  };
  ACT.chart = () => { const d = DEMO.analytics.Sales[App.ui.per], l = DEMO.analytics.labels[App.ui.per], mx = Math.max(...d); $('#ch').innerHTML = `<div class="bars">${d.map((v, i) => `<div class="b"><i style="height:${Math.round(v / mx * 100)}%"></i><span>${l[i]}</span></div>`).join('')}</div><p class="xs faint" style="margin-top:8px">Sales in ₦ thousands — illustrative demo series.</p>`; };

  /* ---------------- notifications / more / profile / settings / support ---------------- */
  screens.notifications = {
    render: () => `${hdr('Notifications', { right: '<button class="chip" data-act="readall">Mark all read</button>' })}<div id="nl"></div>`,
    mount: () => { const f = () => M().notifs.length ? M().notifs.map(n => `<div class="li" data-act="readn" ${P({ id: n.id })}><div class="ico">${ic('bell')}</div><div class="grow"><div class="t">${esc(n.t)}${n.read ? '' : ' <span class="badge">New</span>'}</div><div class="s">${esc(n.b)}</div></div><div class="xs faint">${fmtTs(n.ts)}</div></div>`).join('') + '<button class="btn ghost block" style="margin-top:14px" data-act="clearn">Clear all</button>' : empty('bell', "You're all caught up", 'No notifications right now.'); screens.notifications._f = f; loadInto('#nl', f, 300); },
  };
  ACT.readn = (p) => { const n = M().notifs.find(x => x.id === p.id); if (n) n.read = true; save(); $('#nl').innerHTML = screens.notifications._f(); };
  ACT.readall = () => { M().notifs.forEach(n => n.read = true); save(); $('#nl').innerHTML = screens.notifications._f(); toast('All marked as read'); };
  ACT.clearn = () => { M().notifs = []; save(); $('#nl').innerHTML = screens.notifications._f(); };
  screens.more = {
    tab: 'more',
    render: () => `${hdr('More', { noBack: true })}<div class="card" style="padding:4px 16px">${[['box', 'Inventory', 'inventory'], ['users', 'Customers', 'customers'], ['percent', 'Earnings & Commission', 'earnings'], ['chart', 'Analytics', 'analytics'], ['bell', 'Notifications', 'notifications'], ['store', 'Business Profile', 'profile'], ['settings', 'Business Settings', 'settings'], ['help', 'Support', 'support']].map(r => `<div class="li" data-go="${r[2]}"><div class="ico">${ic(r[0])}</div><div class="grow t">${r[1]}</div>${ic('chevR')}</div>`).join('')}</div><button class="btn danger block" style="margin-top:16px" data-act="logout">${ic('logout')} Log out</button><p class="xs faint" style="text-align:center;margin-top:14px">Hybills Merchant · DEMO MODE · v0.1 prototype</p>`,
  };
  ACT.logout = () => { toast('Logged out'); setTimeout(() => reset('login'), 500); };
  screens.profile = {
    render: () => `${hdr('Business Profile', { right: `<button class="iconbtn" data-act="bedit" aria-label="Edit">${ic('edit')}</button>` })}<div class="card" style="text-align:center"><div class="iconbtn" style="width:64px;height:64px;border-radius:18px;margin:0 auto 10px;color:var(--hb-cyan)">${ic('store')}</div><b style="font-size:18px">${esc(M().name)}</b><div class="sm muted">${esc(M().category)}</div></div><div class="card bk" style="margin-top:12px"><div class="r"><span>Email</span><b>${esc(M().email)}</b></div><div class="r"><span>Phone</span><b>${esc(M().phone)}</b></div><div class="r"><span>Address</span><b>${esc(M().address)}</b></div></div><div class="card row between" style="margin-top:12px"><div><b>Store open</b><div class="xs muted">Customers can order when open</div></div><button class="toggle ${M().open ? 'on' : ''}" data-act="mopen" aria-label="Store open"></button></div>`,
  };
  ACT.mopen = (p, t) => { M().open = !M().open; save(); t.classList.toggle('on'); toast(M().open ? 'Store is open' : 'Store is closed'); };
  ACT.bedit = () => sheet(`<h3 style="margin-bottom:12px">Edit business</h3>${field('bn', 'Business name', 'store', M().name)}${field('bc', 'Category', 'tag', M().category)}${field('ba', 'Address', 'pin', M().address)}${field('bp', 'Phone', 'phone', M().phone, 'tel')}<button class="btn block" data-act="bsave">Save</button>`);
  ACT.bsave = () => { clr(); if (!$('#bn').value.trim()) return bad('bn', 'Business name is required'); Object.assign(M(), { name: $('#bn').value.trim(), category: $('#bc').value.trim(), address: $('#ba').value.trim(), phone: $('#bp').value.trim() }); save(); closeSheet(); rerender(); toast('Business profile updated'); };
  screens.settings = {
    render: () => { const s = M().settings; return `${hdr('Business Settings')}<div class="card" style="padding:4px 16px">${[['orderAlerts', 'New order alerts', 'Notify me for every order'], ['lowStock', 'Low-stock alerts', 'Warn when stock drops below 10'], ['autoAccept', 'Auto-accept orders', 'Skip the manual accept step']].map(r => `<div class="li" style="cursor:default"><div class="grow"><div class="t">${r[1]}</div><div class="s">${r[2]}</div></div><button class="toggle ${s[r[0]] ? 'on' : ''}" data-act="setting" ${P({ k: r[0] })} aria-label="${r[1]}"></button></div>`).join('')}</div>
      <div class="h2">Demo tools</div><div class="card" style="padding:4px 16px"><div class="li" style="cursor:default"><div class="grow"><div class="t">Use DEMO placeholder commission <span class="tag-demo">Demo</span></div><div class="s">Flat 1% PLACEHOLDER to exercise the pipeline. Not HyBills rates. Default off.</div></div><button class="toggle ${S().demoRates ? 'on' : ''}" data-act="demorates" aria-label="Demo commission"></button></div><div class="li" data-act="simerr"><div class="ico">${ic('alert')}</div><div class="grow"><div class="t">Simulate next load error</div></div></div><div class="li" data-act="resetdemo"><div class="ico">${ic('refresh')}</div><div class="grow"><div class="t">Reset demo data</div></div></div></div>`; },
  };
  ACT.setting = (p, t) => { M().settings[p.k] = !M().settings[p.k]; save(); t.classList.toggle('on'); };
  ACT.demorates = (p, t) => { S().demoRates = !S().demoRates; save(); t.classList.toggle('on'); toast(S().demoRates ? 'DEMO placeholder commission ON' : 'Commission: UNVERIFIED'); };
  ACT.simerr = () => { S().simError = true; save(); toast('Next list will fail once — open Orders'); };
  ACT.resetdemo = () => { resetDemo(); toast('Demo data reset'); setTimeout(() => reset('dash'), 500); };
  screens.support = {
    render: () => `${hdr('Support')}<div class="h2" style="margin-top:0">FAQs</div>${[['How do payouts work?', 'Withdrawals are simulated in this demo and never move real money.'], ['Why is commission unverified?', 'The real HyBills commission rules are not connected in this prototype.'], ['How do I update stock?', 'Open More → Inventory and use the + / − controls.']].map((f, i) => `<div class="card tap" style="margin-bottom:8px" data-act="faq" ${P({ i })}><div class="row between"><b class="sm">${esc(f[0])}</b>${ic('chevR')}</div><div class="sm muted" id="fa${i}" style="display:none;margin-top:8px">${esc(f[1])}</div></div>`).join('')}<div class="h2">Contact us</div><div id="sform"><div class="field" id="f-smsg"><label>Message</label><div class="inp"><textarea id="smsg" rows="3" placeholder="How can we help?"></textarea></div><span class="msg" id="m-smsg"></span></div><button class="btn block" data-act="ssend">Send message</button></div>`,
  };
  ACT.faq = (p) => { const a = $('#fa' + p.i); a.style.display = a.style.display === 'none' ? 'block' : 'none'; };
  ACT.ssend = async (_, b) => { clr(); if ($('#smsg').value.trim().length < 5) return bad('smsg', 'Please add a few more details'); b.disabled = true; b.innerHTML = '<span class="spin"></span> Sending…'; await sleep(800); $('#sform').innerHTML = empty('check', 'Message sent', `Ticket ${ref('SUP')} created. (Demo — no email sent.)`); };

  App.boot({ role: 'merchant', title: 'Hybills Merchant App', screens, start: 'splash', tabs: [{ id: 'home', screen: 'dash', label: 'Home', icon: 'home' }, { id: 'orders', screen: 'orders', label: 'Orders', icon: 'box' }, { id: 'products', screen: 'products', label: 'Products', icon: 'tag' }, { id: 'wallet', screen: 'wallet', label: 'Wallet', icon: 'wallet' }, { id: 'more', screen: 'more', label: 'More', icon: 'more' }] });
})();
</script></body></html>
