<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Photography pending: no verified photograph of this property yet">
  <title>Photography pending — no verified photograph yet</title>
  <desc>An illustrated placeholder shown in place of a hotel photograph. It is a graphic treatment, not a picture of the property. Verified property imagery appears here once usage rights are confirmed.</desc>

  <defs>
    <!-- Deep, calm base. Reads as a designed surface rather than a void. -->
    <linearGradient id="base" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#070D18"/>
      <stop offset="0.55" stop-color="#0C1524"/>
      <stop offset="1" stop-color="#111C30"/>
    </linearGradient>

    <!-- Single soft cyan bloom above the mark: gives the tile depth and focus. -->
    <radialGradient id="bloom" cx="0.5" cy="0.34" r="0.62">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#38BDF8" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <!-- Cool floor gradient so the lower half does not flatten out. -->
    <linearGradient id="floor" x1="0" y1="330" x2="0" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0E1A2C" stop-opacity="0"/>
      <stop offset="1" stop-color="#0A1220" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Corner vignette to settle the edges at every crop ratio. -->
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>

    <!-- Architectural line art. A generic facade drawn as a diagram, never as
         a view of a real building, so it cannot be mistaken for a photograph. -->
    <linearGradient id="artStroke" x1="0" y1="140" x2="0" y2="312" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7DD3FC" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0.22"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1" opacity="0.5"/>
    </pattern>

    <pattern id="lattice" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0 L0 0 0 18" fill="none" stroke="#38BDF8" stroke-width="1" opacity="0.16"/>
    </pattern>

    <!-- Soft keyline that sits under the headline. -->
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 1. Surface -->
  <rect width="800" height="600" fill="url(#base)"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <rect width="800" height="600" fill="url(#bloom)"/>
  <rect y="330" width="800" height="270" fill="url(#floor)"/>

  <!-- 2. Depth: faint horizon band behind the mark -->
  <rect y="312" width="800" height="1" fill="#38BDF8" opacity="0.14"/>
  <rect y="298" width="800" height="14" fill="url(#lattice)" opacity="0.5"/>

  <!-- 3. Generic facade diagram -->
  <g stroke="url(#artStroke)" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- cornice -->
    <path d="M232 300 H568"/>
    <path d="M262 288 H538"/>
    <!-- central block with arched openings -->
    <path d="M330 300 V214 a70 70 0 0 1 140 0 V300"/>
    <path d="M356 300 V222 a44 44 0 0 1 88 0 V300"/>
    <!-- flanking wings -->
    <path d="M262 300 V226 H330"/>
    <path d="M470 300 V226 H538"/>
    <!-- window ticks -->
    <path d="M282 250 h26 M282 274 h26" stroke-width="2"/>
    <path d="M492 250 h26 M492 274 h26" stroke-width="2"/>
    <!-- entry step -->
    <path d="M300 300 H500" stroke-width="2"/>
    <path d="M368 300 V252 h64 v48" stroke-width="2"/>
  </g>

  <!-- Aperture mark: a framing device, the universal "image withheld" cue. -->
  <g transform="translate(400 168)" fill="none" stroke="#7DD3FC" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <circle cx="0" cy="0" r="19"/>
    <path d="M0 -19 V-6 M0 6 V19 M-19 0 H-6 M6 0 H19"/>
    <circle cx="0" cy="0" r="7" opacity="0.6"/>
  </g>

  <!-- 4. Hierarchy: accent rule, then the three-line statement -->
  <rect x="326" y="332" width="148" height="2.5" rx="1.25" fill="url(#rule)"/>

  <text x="400" y="378" text-anchor="middle" fill="#F1F5F9"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="-0.4">
    Photography pending
  </text>

  <text x="400" y="412" text-anchor="middle" fill="#A8B6C8"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="23" font-weight="500">
    No verified photograph yet
  </text>

  <text x="400" y="444" text-anchor="middle" fill="#6B7C93"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="500">
    Verified property imagery appears here once rights are confirmed
  </text>

  <!-- 5. Edge treatment -->
  <rect width="800" height="600" fill="url(#vignette)"/>
</svg>