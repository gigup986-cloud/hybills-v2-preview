<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>HyBills Mobile App MVP</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2264%22%20height%3D%2264%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22bgi%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%230b3a46%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23041219%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22url%28%23bgi%29%22/%3E%3C/svg%3E">
  <meta name="theme-color" content="#041219">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* HyBills approved design tokens */
    :root {
      --hb-bg: #041219;
      --hb-bg-2: #071c26;
      --hb-surface: #0b2531;
      --hb-surface-2: #10303f;
      --hb-surface-3: #16414f;
      --hb-border: rgba(110, 225, 235, 0.14);
      --hb-border-strong: rgba(110, 225, 235, 0.28);
      --hb-cyan: #22d3ee;
      --hb-cyan-2: #67e8f9;
      --hb-teal: #14b8a6;
      --hb-green: #34d399;
      --hb-amber: #fbbf24;
      --hb-red: #fb7185;
      --hb-text: #e9fbff;
      --hb-muted: #8db3be;
      --hb-faint: #5d8591;
      --hb-grad: linear-gradient(135deg, #22d3ee 0%, #14b8a6 100%);
      --hb-grad-soft: linear-gradient(160deg, rgba(34, 211, 238, 0.18), rgba(20, 184, 166, 0.06));
      --hb-r-sm: 10px; --hb-r-md: 14px; --hb-r-lg: 20px; --hb-r-xl: 28px; --hb-r-pill: 999px;
      --hb-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      --hb-glow: 0 0 0 1px rgba(34, 211, 238, 0.35), 0 8px 28px rgba(34, 211, 238, 0.22);
      --hb-font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px; --sp-8: 32px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: #020a0f; font-family: var(--hb-font); color: var(--hb-text); }
    body { display: flex; align-items: center; justify-content: center; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    input, select, textarea { font: inherit; color: inherit; }

    .phone {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 100vw;
      background: var(--hb-bg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    @media (min-width: 520px) {
      .phone {
        width: 390px;
        height: min(844px, 100vh - 20px);
        border-radius: 44px;
        border: 1px solid var(--hb-border-strong);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 0 8px #07161e;
      }
    }
    .phone::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(120% 60% at 50% -10%, rgba(34, 211, 238, 0.16), transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* iOS status bar */
    .statusbar {
      height: 30px;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 18px 0;
      font-size: 11.5px;
      font-weight: 700;
      z-index: 10;
      position: relative;
      letter-spacing: -0.2px;
    }
    .statusbar .sb-r { display: flex; gap: 5px; align-items: center; opacity: 0.95; }

    /* Screen container */
    #view {
      flex: 1;
      position: relative;
      overflow-y: auto;
      overflow-x: hidden;
      z-index: 1;
      scrollbar-width: none;
    }
    #view::-webkit-scrollbar { display: none; }

    .screen {
      min-height: 100%;
      padding: 0 12px 16px;
      animation: scr 0.25s ease both;
    }
    @keyframes scr {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }
    .screen.back { animation-name: scrb; }
    @keyframes scrb {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: none; }
    }

    /* Header */
    .hdr {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 0 8px;
      position: sticky;
      top: 0;
      z-index: 8;
      background: linear-gradient(var(--hb-bg) 75%, transparent);
    }
    .hdr h1 { font-size: 15px; font-weight: 800; flex: 1; letter-spacing: -0.2px; }
    .iconbtn {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: var(--hb-surface);
      border: 1px solid var(--hb-border);
      position: relative;
      flex: none;
      transition: transform 0.12s, background 0.15s, border-color 0.15s;
      color: #ffffff;
      cursor: pointer;
    }
    .iconbtn:hover {
      background: rgba(34, 211, 238, 0.18);
      border-color: rgba(34, 211, 238, 0.45);
      color: #22d3ee;
    }
    .iconbtn:active { transform: scale(0.92); }
    .iconbtn .dot {
      position: absolute;
      top: 8px;
      right: 9px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--hb-red);
      border: 2px solid var(--hb-surface);
    }
    .ic { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

    /* Typography */
    .h2 { font-size: 12px; font-weight: 800; margin: 10px 0 6px; display: flex; align-items: center; justify-content: space-between; }
    .h2 a, .link { font-size: 11px; font-weight: 700; color: var(--hb-cyan); cursor: pointer; text-decoration: none; }
    .muted { color: var(--hb-muted); }
    .faint { color: var(--hb-faint); }
    .sm { font-size: 11px; }
    .xs { font-size: 10px; }

    .tag-unv {
      display: inline-block;
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 0.4px;
      color: var(--hb-amber);
      background: rgba(251, 191, 36, 0.12);
      border: 1px solid rgba(251, 191, 36, 0.35);
      padding: 2px 7px;
      border-radius: var(--hb-r-pill);
      text-transform: uppercase;
    }
    .tag-demo {
      display: inline-block;
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 0.4px;
      color: var(--hb-cyan);
      background: rgba(34, 211, 238, 0.1);
      border: 1px solid rgba(34, 211, 238, 0.3);
      padding: 2px 7px;
      border-radius: var(--hb-r-pill);
      text-transform: uppercase;
    }

    /* Cards */
    .card { background: var(--hb-surface); border: 1px solid var(--hb-border); border-radius: 14px; padding: 10px; }
    .card.tap { cursor: pointer; transition: transform 0.12s, border-color 0.15s; }
    .card.tap:active { transform: scale(0.985); }
    .card.tap:hover { border-color: var(--hb-border-strong); }

    .hero {
      background: var(--hb-grad);
      color: #032028;
      border-radius: 18px;
      padding: 12px;
      position: relative;
      overflow: hidden;
      box-shadow: var(--hb-glow);
    }
    .hero::after {
      content: "";
      position: absolute;
      right: -30px;
      top: -30px;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.18);
    }
    .hero .lbl { font-size: 11px; font-weight: 700; opacity: 0.8; }
    .hero .amt { font-size: 20px; font-weight: 800; letter-spacing: -0.4px; margin: 2px 0 8px; }
    .hero .btn { background: #03242d; color: var(--hb-cyan-2); padding: 7px 12px; font-size: 12px; }

    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }

    .svc {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 700;
      padding: 8px 2px;
      border-radius: 10px;
      background: var(--hb-surface);
      border: 1px solid var(--hb-border);
      transition: transform 0.12s, border-color 0.15s;
    }
    .svc:active { transform: scale(0.94); }
    .svc:hover { border-color: var(--hb-border-strong); }
    .svc .ico {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      background: var(--hb-grad-soft);
      color: var(--hb-cyan);
      border: 1px solid var(--hb-border);
    }

    .row { display: flex; align-items: center; gap: 6px; }
    .row.between { justify-content: space-between; }
    .col { display: flex; flex-direction: column; gap: 6px; }
    .grow { flex: 1; min-width: 0; }

    .li { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--hb-border); cursor: pointer; }
    .li:last-child { border-bottom: 0; }
    .li .ico {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      background: var(--hb-surface-2);
      color: var(--hb-cyan);
      flex: none;
    }
    .li .t { font-weight: 700; font-size: 12px; }
    .li .s { font-size: 11px; color: var(--hb-muted); margin-top: 2px; }
    .li .r { text-align: right; font-weight: 800; font-size: 12px; }
    .li .r small { display: block; font-weight: 600; font-size: 10px; color: var(--hb-muted); margin-top: 2px; }
    .pos { color: var(--hb-green); }
    .neg { color: var(--hb-text); }
    .warn { color: var(--hb-amber); }
    .err { color: var(--hb-red); }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 14px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 12.5px;
      background: var(--hb-grad);
      color: #032028;
      box-shadow: 0 6px 20px rgba(34, 211, 238, 0.25);
      transition: transform 0.12s, box-shadow 0.15s, opacity 0.15s;
    }
    .btn:active, .btn.pressed { transform: scale(0.95); box-shadow: 0 2px 8px rgba(34, 211, 238, 0.2); }
    .btn.block { width: 100%; }
    .btn.ghost { background: var(--hb-surface); color: var(--hb-text); border: 1px solid var(--hb-border-strong); box-shadow: none; }
    .btn.danger { background: rgba(251, 113, 133, 0.14); color: var(--hb-red); border: 1px solid rgba(251, 113, 133, 0.4); box-shadow: none; }
    .btn.sm { padding: 7px 12px; font-size: 11.5px; border-radius: 10px; }
    .btn[disabled] { opacity: 0.5; pointer-events: none; }
    .btn .spin { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid rgba(3, 32, 40, 0.25); border-top-color: #032028; animation: sp 0.7s linear infinite; }
    @keyframes sp { to { transform: rotate(360deg); } }

    /* Inputs */
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
    .field label { font-size: 12px; font-weight: 700; color: var(--hb-muted); }
    .inp { display: flex; align-items: center; gap: 10px; background: var(--hb-surface); border: 1px solid var(--hb-border); border-radius: 12px; padding: 0 14px; transition: border-color 0.15s, box-shadow 0.15s; }
    .inp:focus-within { border-color: var(--hb-cyan); box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.15); }
    .inp input, .inp select, .inp textarea { flex: 1; min-width: 0; background: none; border: 0; outline: 0; padding: 12px 0; font-size: 13.5px; font-weight: 600; }
    .inp select option { background: var(--hb-surface); color: var(--hb-text); }
    .inp .ic { color: var(--hb-faint); }
    .field.bad .inp { border-color: var(--hb-red); }
    .field .msg { font-size: 11px; color: var(--hb-red); display: none; font-weight: 600; }
    .field.bad .msg { display: block; }

    .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex: none; padding: 8px 14px; border-radius: var(--hb-r-pill); background: var(--hb-surface); border: 1px solid var(--hb-border); font-size: 12px; font-weight: 700; color: var(--hb-muted); transition: all 0.15s; }
    .chip.on { background: var(--hb-grad); color: #032028; border-color: transparent; }

    .seg { display: flex; background: var(--hb-surface); border: 1px solid var(--hb-border); border-radius: 12px; padding: 4px; gap: 4px; }
    .seg button { flex: 1; padding: 9px; border-radius: 11px; font-size: 13px; font-weight: 700; color: var(--hb-muted); transition: all 0.15s; }
    .seg button.on { background: var(--hb-grad); color: #032028; }

    .amtgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .amtgrid button { padding: 12px 0; border-radius: 12px; background: var(--hb-surface); border: 1px solid var(--hb-border); font-weight: 800; font-size: 13px; transition: all 0.15s; }
    .amtgrid button.on { border-color: var(--hb-cyan); background: rgba(34, 211, 238, 0.14); color: var(--hb-cyan-2); box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.12); }

    .netrow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .net { padding: 10px 4px; border-radius: 12px; background: var(--hb-surface); border: 1px solid var(--hb-border); font-weight: 800; font-size: 12px; text-align: center; transition: all 0.15s; }
    .net.on { border-color: var(--hb-cyan); background: rgba(34, 211, 238, 0.14); }
    .net i { display: block; width: 26px; height: 26px; border-radius: 50%; margin: 0 auto 6px; display: grid; place-items: center; font-style: normal; font-size: 11px; color: #032028; }

    .badge { display: inline-block; padding: 3px 9px; border-radius: var(--hb-r-pill); font-size: 10.5px; font-weight: 800; background: var(--hb-surface-3); color: var(--hb-cyan-2); }
    .badge.ok { background: rgba(52, 211, 153, 0.15); color: var(--hb-green); }
    .badge.warn { background: rgba(251, 191, 36, 0.15); color: var(--hb-amber); }
    .badge.err { background: rgba(251, 113, 133, 0.15); color: var(--hb-red); }

    /* 5-Tab Bar matching reference design: [Home, Services, Travel, Activity, Profile] */
    .tabbar {
      flex: none;
      display: flex;
      justify-content: space-around;
      padding: 4px 4px 6px;
      background: rgba(5, 24, 33, 0.94);
      backdrop-filter: blur(14px);
      border-top: 1px solid var(--hb-border);
      z-index: 15;
      position: relative;
    }
    .tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 9.5px;
      font-weight: 700;
      color: var(--hb-faint);
      padding: 3px 6px;
      border-radius: 10px;
      min-width: 44px;
      transition: color 0.15s;
    }
    .tab.on { color: var(--hb-cyan); }
    .tab.on .ic { filter: drop-shadow(0 0 6px rgba(34, 211, 238, 0.6)); }

    /* Breakdown & sheets */
    .bk { display: flex; flex-direction: column; gap: 10px; }
    .bk .r { display: flex; justify-content: space-between; font-size: 13.5px; gap: 12px; }
    .bk .r span:first-child { color: var(--hb-muted); }
    .bk .r b { font-weight: 800; text-align: right; }
    .bk .tot { border-top: 1px dashed var(--hb-border-strong); padding-top: 12px; font-size: 16px; }
    .bk .tot span:first-child { color: var(--hb-text); font-weight: 800; }

    .scrim { position: absolute; inset: 0; background: rgba(1, 8, 12, 0.65); z-index: 30; animation: fade 0.2s; }
    .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--hb-bg-2); border-top: 1px solid var(--hb-border-strong); border-radius: 26px 26px 0 0; padding: 10px var(--sp-5) 26px; z-index: 31; max-height: 85%; overflow: auto; animation: up 0.28s cubic-bezier(0.2, 0.9, 0.3, 1); }
    .sheet .grab { width: 42px; height: 4px; border-radius: 4px; background: var(--hb-border-strong); margin: 0 auto 14px; }
    @keyframes up { from { transform: translateY(100%); } to { transform: none; } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

    .toast { position: absolute; left: 50%; bottom: 68px; transform: translateX(-50%); background: var(--hb-surface-3); border: 1px solid var(--hb-border-strong); padding: 9px 14px; border-radius: var(--hb-r-pill); font-size: 12px; font-weight: 700; z-index: 50; box-shadow: var(--hb-shadow); animation: up 0.25s, fade 0.25s; max-width: 88%; text-align: center; }

    .skel { border-radius: 12px; background: linear-gradient(90deg, var(--hb-surface) 25%, var(--hb-surface-2) 50%, var(--hb-surface) 75%); background-size: 200% 100%; animation: sh 1.2s infinite; }
    @keyframes sh { to { background-position: -200% 0; } }
    .empty, .errstate { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 44px 20px; color: var(--hb-muted); }
    .empty .big, .errstate .big { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: var(--hb-surface); border: 1px solid var(--hb-border); }
    .errstate .big { color: var(--hb-red); background: rgba(251, 113, 133, 0.1); }
    .empty b, .errstate b { color: var(--hb-text); font-size: 13.5px; }

    .toggle { width: 46px; height: 27px; border-radius: 20px; background: var(--hb-surface-3); position: relative; transition: background 0.2s; flex: none; border: 1px solid var(--hb-border); }
    .toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 21px; height: 21px; border-radius: 50%; background: #cfeef5; transition: transform 0.2s; }
    .toggle.on { background: var(--hb-teal); }
    .toggle.on::after { transform: translateX(19px); }

    /* Motion Feedback / Celebration */
    .mf { position: absolute; inset: 0; z-index: 60; background: radial-gradient(100% 70% at 50% 28%, #0b3a46 0%, #041219 70%); display: flex; flex-direction: column; align-items: center; padding: 70px 26px 28px; animation: fade 0.25s; overflow: hidden; }
    .mf-stage { position: relative; width: 200px; height: 200px; display: grid; place-items: center; flex: none; }
    .mf-ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--hb-cyan); opacity: 0; animation: ring 1.6s ease-out forwards; }
    .mf-ring.r2 { animation-delay: 0.2s; border-color: var(--hb-green); }
    .mf-ring.r3 { animation-delay: 0.4s; border-color: var(--hb-cyan-2); }
    @keyframes ring { 0% { transform: scale(0.3); opacity: 0.9; } 100% { transform: scale(1.5); opacity: 0; } }
    .mf-core { position: relative; width: 104px; height: 104px; border-radius: 50%; background: var(--hb-grad); display: grid; place-items: center; box-shadow: 0 0 50px rgba(34, 211, 238, 0.55); animation: pop 0.7s cubic-bezier(0.2, 1.5, 0.4, 1) both 0.1s; }
    .mf-orbit { position: absolute; inset: 20px; transform: rotate(-90deg); }
    .mf-orbit circle { fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 420; stroke-dashoffset: 420; animation: draw 1s ease forwards 0.15s; opacity: 0.9; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .mf-check { position: absolute; right: -4px; bottom: -4px; width: 36px; height: 36px; border-radius: 50%; background: var(--hb-green); display: grid; place-items: center; color: #032028; border: 3px solid var(--hb-bg); animation: pop 0.5s cubic-bezier(0.2, 1.6, 0.4, 1) both 0.75s; }
    .mf-p { position: absolute; left: 50%; top: 50%; width: 9px; height: 9px; margin: -4.5px; background: var(--c); border-radius: var(--rd, 50%); opacity: 0; animation: burst 1.5s cubic-bezier(0.15, 0.8, 0.3, 1) forwards var(--dl, 0.35s); }
    @keyframes burst { 0% { opacity: 1; transform: rotate(var(--a)) translateX(30px) scale(0.4); } 70% { opacity: 1; } 100% { opacity: 0; transform: rotate(var(--a)) translateX(var(--d)) rotate(var(--sp, 200deg)) scale(1); } }
    .mf h2 { font-size: 24px; font-weight: 800; margin-top: 22px; }
    .mf .mf-amt { font-size: 38px; font-weight: 800; letter-spacing: -1px; margin: 6px 0 18px; background: var(--hb-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .mf dl { width: 100%; background: var(--hb-surface); border: 1px solid var(--hb-border); border-radius: 16px; padding: 6px 16px; }
    .mf dl div { display: flex; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--hb-border); font-size: 13px; }
    .mf dl div:last-child { border: 0; }
    .mf dt { color: var(--hb-muted); }
    .mf dd { font-weight: 800; text-align: right; }
    .mf .mf-actions { margin-top: auto; width: 100%; display: flex; flex-direction: column; gap: 10px; }
    .mf .mf-timer { height: 3px; border-radius: 3px; background: var(--hb-surface-2); overflow: hidden; }
    .mf .mf-timer i { display: block; height: 100%; width: 100%; background: var(--hb-grad); transform-origin: left; animation: shrink var(--dur, 6s) linear forwards; }
    @keyframes shrink { to { transform: scaleX(0); } }
    @keyframes pop { from { transform: scale(0.3) rotate(-12deg); opacity: 0; } to { transform: none; opacity: 1; } }

    /* In-app top role switcher banner */
    .role-top-banner {
      display: flex;

  /* ==========================================================================
   HYBILLS AI CHARACTER — 3D Animated Cyan Companion
   Based on HYBILLS_AI_DESIGN_SPEC.md & Approved Reference Visual
   ========================================================================== */

.hb-char-fab {
  position: absolute;
  top: auto;
  bottom: 62px;
  right: 8px;
  left: auto;
  width: 38px;
  height: 38px;
  z-index: 25;
  cursor: grab;
  outline: none;
  border: none;
  background: none;
  padding: 0;
  display: grid;
  place-items: center;
  transition: transform .18s cubic-bezier(.34,1.56,.64,1);
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
}
.hb-char-fab:active {
  transform: scale(.92);
}
.hb-char-fab.hb-dragging { cursor: grabbing; }
.hb-char-fab:focus-visible {
  filter: drop-shadow(0 0 6px var(--hb-cyan));
}

/* Floating ambient breathing */
.hb-char-container {
  position: relative;
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  animation: char-float 3.4s infinite ease-in-out;
}
@keyframes char-float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

/* SVG Character Core */
.hb-char-svg {
  width: 100%;
  height: 100%;
  overflow: visible;
  filter: drop-shadow(0 6px 14px rgba(4,18,25,.75));
}

/* Character Spherical Glow */
.hb-char-glow {
  transform-origin: 32px 32px;
  transition: opacity .35s, transform .35s;
}

/* Concentric Listening Waves */
.hb-char-wave {
  opacity: 0;
  transform-origin: 32px 32px;
  stroke: var(--hb-cyan);
  fill: none;
  stroke-width: 1.6;
}
.hb-char-state-listening .hb-char-wave-1 {
  animation: char-wave-ping 2.2s infinite ease-out;
}
.hb-char-state-listening .hb-char-wave-2 {
  animation: char-wave-ping 2.2s infinite ease-out .55s;
}
.hb-char-state-listening .hb-char-wave-3 {
  animation: char-wave-ping 2.2s infinite ease-out 1.1s;
}
@keyframes char-wave-ping {
  0% { transform: scale(.7); opacity: .85; }
  100% { transform: scale(1.6); opacity: 0; }
}

/* Orbital Saturn Ring (Helpful & Active states) */
.hb-char-orbit-ring {
  opacity: 0;
  transform-origin: 32px 32px;
  transition: opacity .4s ease, transform .4s ease;
  transform: rotate(-18deg) scale(0.9);
}
.hb-char-state-helpful .hb-char-orbit-ring,
.hb-char-state-speaking .hb-char-orbit-ring {
  opacity: .95;
  transform: rotate(-18deg) scale(1);
  animation: char-orbit-wobble 4s infinite ease-in-out alternate;
}
@keyframes char-orbit-wobble {
  0% { transform: rotate(-18deg) scale(1); }
  100% { transform: rotate(-14deg) scale(1.05); }
}

/* Eye Rigging & Expressive Gaze Movement */
.hb-char-eyes {
  transform-origin: 32px 27px;
  transition: transform .24s cubic-bezier(.34,1.56,.64,1);
}
.hb-char-pupil-group {
  transform-origin: 32px 27px;
  transition: transform .22s cubic-bezier(.2,.9,.3,1);
}

/* Natural Blinking Animation in Idle */
.hb-char-eyelids {
  transform-origin: 32px 27px;
  animation: char-blink-cycle 4.4s infinite ease-in-out;
}
@keyframes char-blink-cycle {
  0%, 91%, 96%, 100% { transform: scaleY(1); }
  93.5% { transform: scaleY(0.08); }
}

/* Natural Multi-Directional Eye Glances in Idle (Left, Center, Right-Up, Down) */
.hb-char-state-idle .hb-char-pupil-group {
  animation: char-idle-saccades 8.4s infinite ease-in-out;
}
@keyframes char-idle-saccades {
  0%, 16% { transform: translate(0, 0); } /* Center forward */
  22%, 36% { transform: translate(-2.4px, 0.4px); } /* Glance Left */
  42%, 52% { transform: translate(0, 0); } /* Return Center */
  58%, 70% { transform: translate(2.2px, -1.5px); } /* Glance Right & slightly Up */
  76%, 86% { transform: translate(0.2px, 1.8px); } /* Glance Down */
  92%, 100% { transform: translate(0, 0); } /* Center */
}

/* Listening State: Immediate attentive forward focus */
.hb-char-state-listening .hb-char-eyes {
  transform: scale(1.08);
}
.hb-char-state-listening .hb-char-pupil-group {
  animation: none !important;

.hb-char-state-listening .hb-char-eyelids {

.hb-char-state-speaking .hb-char-eyes {
  transform: scale(1.04);
}
.hb-char-state-speaking .hb-char-pupil-group {
  animation: none !important;

.hb-char-state-thinking .hb-char-eyes {
  transform: scale(0.98);
}
.hb-char-state-thinking .hb-char-pupil-group {

/* Sympathetic & Error States: Soft drooping eyelids, downcast gaze, tear glint */
.hb-char-state-sympathetic .hb-char-eyelids,
.hb-char-state-error .hb-char-eyelids {

@keyframes char-tear-gleam {
  0% { transform: scale(0.85); opacity: .6; }
  100% { transform: scale(1.1); opacity: 1; }
}

/* Animated Mouth System */
.hb-char-mouth {
  transform-origin: 32px 38.5px;
  transition: transform .22s cubic-bezier(.34,1.56,.64,1);
}
.hb-char-mouth path,
.hb-char-mouth ellipse,
.hb-char-mouth g {
  opacity: 0;
  transition: opacity .18s ease, transform .22s ease;
  transform-origin: 32px 38.5px;
}

/* 1. Idle Mouth: Subtle smile with occasional gentle breathing movement */
.hb-char-state-idle .hb-char-mouth-smile {
  opacity: 1;
  animation: char-idle-mouth-subtle 8.4s infinite ease-in-out;
}
@keyframes char-idle-mouth-subtle {
  0%, 55%, 100% { transform: scale(1) translateY(0); }
  60%, 82% { transform: scale(1.05) translateY(-0.25px); }
}

/* 2. Listening Mouth: Attentive, gentle expression */
.hb-char-state-listening .hb-char-mouth-listening {
  opacity: 1;
  transform: scale(1.06);
}

/* 3. Thinking Mouth: Thoughtful pursed curve */
.hb-char-state-thinking .hb-char-mouth-thinking {
  opacity: 1;
  transform: translate(0.4px, -0.3px);
}

/* 4. Speaking Mouth: Rhythmically vocalizing in sync with audio */
.hb-char-state-speaking .hb-char-mouth-speaking {
  opacity: 1;
  animation: char-vocalize-talk .24s infinite alternate ease-in-out;
}
@keyframes char-vocalize-talk {
  0% { transform: scaleY(0.4) scaleX(0.85); }
  50% { transform: scaleY(1.3) scaleX(1.08); }
  100% { transform: scaleY(0.65) scaleX(0.92); }
}

/* 5. Happy / Success Mouth: Joyful wide open crescent smile */
.hb-char-state-happy .hb-char-mouth-happy {
  opacity: 1;
  animation: char-happy-smile-bounce 1.4s infinite alternate ease-in-out;
}
@keyframes char-happy-smile-bounce {
  0% { transform: scale(1.02); }
  100% { transform: scale(1.14) translateY(-0.4px); }
}

/* 6. Sympathetic & Error Mouth: Compassionate soft downturned curve */
.hb-char-state-sympathetic .hb-char-mouth-sympathetic,
.hb-char-state-error .hb-char-mouth-sympathetic {
  opacity: 1;
  transform: translateY(0.4px);
}

/* 7. Sleepy Yawn Animation Cycle */
.hb-char-state-yawning .hb-char-mouth-yawn {
  opacity: 1;
  animation: char-yawn-mouth-anim 3.2s ease-in-out forwards;
}
@keyframes char-yawn-mouth-anim {
  0% { transform: scale(0.2); opacity: 0; }
  14% { transform: scale(0.7); opacity: 1; }
  32%, 66% { transform: scale(1.18) translateY(0.5px); opacity: 1; }
  84% { transform: scale(0.5); opacity: 0.8; }
  100% { transform: scale(0.1); opacity: 0; }
}

.hb-char-state-yawning .hb-char-eyelids {
  animation: char-yawn-eyelids-anim 3.2s ease-in-out forwards !important;
}
@keyframes char-yawn-eyelids-anim {
  0% { transform: scaleY(1); }
  22%, 64% { transform: scaleY(0.42) translateY(1.7px); } /* Droop during yawn */
  78% { transform: scaleY(0.06) translateY(2px); } /* Sleepy blink */
  90% { transform: scaleY(0.5); }
  100% { transform: scaleY(1); }
}

.hb-char-state-yawning .hb-char-pupil-group {
  animation: char-yawn-pupils-anim 3.2s ease-in-out forwards !important;
}
@keyframes char-yawn-pupils-anim {
  0% { transform: translate(0, 0); }
  25%, 65% { transform: translate(0, 1.6px); } /* Sleepy downward gaze */
  100% { transform: translate(0, 0); }
}

.hb-char-state-yawning .hb-char-container {
  animation: char-yawn-body-anim 3.2s ease-in-out forwards !important;
}
@keyframes char-yawn-body-anim {
  0% { transform: translateY(0) scale(1); }
  35%, 65% { transform: translateY(-3.5px) scale(1.05); }
  100% { transform: translateY(0) scale(1); }
}

/* Reduced Motion Accessibility */
@media (prefers-reduced-motion: reduce) {
  .hb-char-container,
  .hb-char-eyelids,
  .hb-char-pupil-group,
  .hb-char-thinking-spinner,
  .hb-char-state-listening .hb-char-wave-1,
  .hb-char-state-listening .hb-char-wave-2,
  .hb-char-state-listening .hb-char-wave-3,
  .hb-char-sparkles,
  .hb-char-orbit-ring,
  .hb-char-mouth-speaking,
  .hb-char-mouth-happy,
  .hb-char-mouth-yawn,
  .hb-char-state-idle .hb-char-mouth-smile {
    animation: none !important;
  }
}

    /* ---------- Assistant: real voice (browser speech APIs), live backend (/api/chat) and navigation ---------- */
    const hbSR = window.SpeechRecognition || window.webkitSpeechRecognition || null;

      ['train', /\b(trains?|railway|nrc)\b/],

      ['wallet', /\b(wallet|add money|fund|transfer|withdraw|send money)\b/],
      ['support', /\b(support|customer care|help (center|centre|desk))\b/],
      ['settings', /\bsettings?\b/],
      ['notifications', /\bnotifications?\b/],
      ['account', /\b(account (info|details?)|my account)\b/],

    const HB_BTN = (id, label) => `<button class="btn sm" data-go="${id}" style="margin:6px 6px 0 0;">${esc(label)} &rarr;</button>`;

    const hbNavIntent = (raw) => {
      const t = String(raw).toLowerCase().replace(/[^\w&' ]+/g, ' ').replace(/\s+/g, ' ').trim();
      if (!t) return null;
      const openV = HB_OPEN.test(t), actV = HB_ACT.test(t), bare = t.split(' ').length <= 3;
      const explicit = /\b(open|go to|take me|show me|navigate)\b/.test(t);
      if (/^(how|what|when|why|where|which|who|can|could|does|do|is|are|will|should|tell me)\b/.test(t) && !explicit) return null;
      let target = null;
      for (const [id, re] of HB_TARGETS) { if (re.test(t)) { target = id; break; } }
      if (target) {
        if (!(openV || actV || bare)) return null;
        return { type: 'go', id: target, act: actV };
      }
      if (/(^| )(go|take me|navigate|move) back\b|^(please )?back$|previous (screen|page)/.test(t)) return { type: 'back' };
      if (!(openV || actV)) return null;

    /* ---------- text helpers ---------- */
    const hbPlain = (html) => {
      const s = String(html || '').replace(/<button[\s\S]*?<\/button>/gi, ' ').replace(/<br\s*\/?>/gi, '. ');

    };
    const hbHtml = (txt) => esc(String(txt)).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
    const hbNorm = (s) => String(s).toLowerCase().replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();

    /* ---------- status UI (mode banner, speaker toggle, voice bar) ---------- */
    const hbPaintMode = () => {
      const m = hbAi.mode;
      const lab = $('#ai-mode-label'), tag = $('#ai-mode-tag'), st = $('#ai-status'), stt = $('#ai-status-text');
      const txt = { checking: ['Checking AI serviceâ€¦', 'CHECKING', 'Checkingâ€¦', '#fbbf24'],

        live: ['Live AI (Gemini via server)', 'LIVE AI', 'Live AI', '#34d399'],

      if (tag) tag.textContent = txt[1];

      if (st) st.style.color = txt[3];
    };
    const hbSetMode = (mode, reason) => { hbAi.mode = mode; hbAi.reason = reason || ''; hbPaintMode(); };
    const hbVoiceOn = () => !!(S().cust && S().cust.voiceReplies);
    const hbPaintSpeaker = () => {
      const b = $('#ai-speak-btn'); if (!b) return;

      if (state === 'idle') { bar.style.display = 'none'; return; }

    const aiStopListening = (abort) => {
      const r = hbAi.rec; hbAi.rec = null;
      if (r) { r.onresult = r.onerror = r.onend = r.onaudiostart = null; try { abort ? r.abort() : r.stop(); } catch (e) {} }
    };
    const aiIsEcho = (heard) => {
      const words = hbNorm(heard).split(' ').filter(Boolean);
      return !words.length || words.every(w => hbAi.spoken.indexOf(w) !== -1);
    };
    const aiListen = (opt) => {
      const o = opt || {}, barge = !!o.barge;
      if (!hbSR) { aiSetState('error', "Voice input isn't supported in this browser (try Chrome, Edge or Safari). You can still type."); return false; }
      if (window.isSecureContext === false) { aiSetState('error', 'Voice input needs a secure (https or localhost) connection.'); return false; }
      aiStopListening(true);
      let rec;
      try { rec = new hbSR(); } catch (e) { aiSetState('error', 'Could not start the microphone.'); return false; }
      hbAi.rec = rec;
      rec.lang = 'en-NG'; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
      const gen0 = hbAi.gen;
      let finalText = '', heardNow = '', bargedIn = false;
      rec.onaudiostart = () => { hbAi.micOK = true; };
      rec.onresult = (ev) => {
        let interim = '';
        for (let i = ev.resultIndex; i < ev.results.length; i++) {
          const r = ev.results[i];
          if (r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript;

          if (aiIsEcho(heard)) return;           /* the assistant hearing its own voice */

        const e = ev && ev.error;
        if (e === 'aborted') return;
        if (barge && !bargedIn && e === 'no-speech') return;

        const denied = (e === 'not-allowed' || e === 'service-not-allowed');

          'not-allowed': 'Microphone access is blocked. Allow the microphone for this site, or type instead.',
          'service-not-allowed': 'Microphone access is blocked. Allow the microphone for this site, or type instead.',
          'no-speech': "I didn't hear anything. Tap the mic and try again.",
          'audio-capture': 'No microphone was found on this device.',

      try { rec.start(); } catch (e) { hbAi.rec = null; aiSetState('error', 'Could not start the microphone.'); return false; }

    const aiStopSpeech = () => {
      hbAi.gen++;
      if (hbTTS) { try { speechSynthesis.cancel(); } catch (e) {} }
    };
    const aiPickVoice = () => {
      try {
        const vs = speechSynthesis.getVoices() || [];
        return vs.find(v => /^en[-_]NG/i.test(v.lang)) || vs.find(v => /^en[-_]GB/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;

      if (!hbTTS) return false;
      const text = hbPlain(html);
      if (!text) return false;
      aiStopSpeech();
      const gen = hbAi.gen;
      hbAi.spoken = hbNorm(text);
      const parts = text.match(/[^.!?]+[.!?]*\s*/g) || [text];
      const chunks = [];
      parts.forEach(p => { const last = chunks.length - 1; if (last >= 0 && (chunks[last].length + p.length) < 180) chunks[last] += p; else chunks.push(p); });
      let i = 0, started = false;
      const voice = aiPickVoice();
      aiSetState('speaking');
      const wd = setTimeout(() => {
        if (gen === hbAi.gen && !started) { aiStopSpeech(); aiSetState('error', 'No spoken voice is available on this device. Text replies still work.'); }
      }, 4000);
      const next = () => {
        if (gen !== hbAi.gen) return;
        if (i >= chunks.length) {
          clearTimeout(wd); aiStopListening(true);
          if (hbAi.state === 'speaking' || hbAi.state === 'paused') aiSetState('idle');
          return;
        }
        const u = new SpeechSynthesisUtterance(chunks[i++]);
        if (voice) { u.voice = voice; u.lang = voice.lang; } else { u.lang = 'en-NG'; }
        u.onstart = () => {
          if (gen !== hbAi.gen) return;
          if (!started) {
            started = true; clearTimeout(wd);
            aiBargeStart();
          }
        };
        u.onend = next;
        u.onerror = (ev) => {
          if (gen !== hbAi.gen) return;
          if (ev && (ev.error === 'interrupted' || ev.error === 'canceled')) return;
          clearTimeout(wd); aiStopListening(true);
          aiSetState('error', 'Spoken replies failed on this device. Text replies still work.');
        };
        try { speechSynthesis.speak(u); } catch (e) { clearTimeout(wd); aiSetState('error', 'Spoken replies failed on this device. Text replies still work.'); }
      };
      next();
      return true;
    };

    /* Called by draw() on every screen change: stop the microphone; stop speech unless a navigation confirmation is being spoken. */
    window.__hbAiStop = () => {
      const pnl = $('#ai-panel'); if (pnl) pnl.remove();
      aiStopListening(true);
      if (!hbAi.persistSpeech) aiStopSpeech();
      hbAi.persistSpeech = false;
      hbAi.state = 'idle';
    };
    document.addEventListener('visibilitychange', () => { if (document.hidden) { aiStopListening(true); aiStopSpeech(); aiSetState('idle'); } });

    /* ---------- navigation ---------- */
    const hbGo = (id) => {
      if (!HB_NAV[id] || !screens[id]) return false;
      if (hbAi.state === 'speaking' || hbAi.state === 'paused') hbAi.persistSpeech = true;
      const tabMap = { home: 'home', services: 'services', travel: 'travel', wallet: 'activity', profile: 'profile' };
      if (tabMap[id]) { tab(tabMap[id]); return true; }
      const st = App.stack;
      if (st.length > 1 && st[st.length - 1].name === 'assistant') st.pop();
      nav(id);

    const hbNavLater = (fn) => setTimeout(() => { if ($('#ai-input')) fn(); }, 700);   /* only if the chat is still on screen */

    /* ---------- live backend ---------- */
    const hbAskServer = async () => {
      if (hbAi.configured === false) return { ok: false, reason: 'AI not configured on server' };
      const c = S().cust;
      const history = (c.chatHistory || []).slice(-12).map(m => ({ from: m.from, text: hbPlain(m.text) }));
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 20000);
      try {
        const res = await fetch('/api/chat', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, signal: ctrl.signal,
          body: JSON.stringify({ messages: history, userContext: { name: c.firstName || 'Customer', wallet: naira(c.wallet) } })
        });
        if (!res.ok) {
          let j = {}; try { j = await res.json(); } catch (e) {}
          return { ok: false, reason: res.status === 503 ? 'AI not configured on server' : res.status === 429 ? 'rate limited' : 'service error' };
        }
        const d = await res.json();
        if (!d || typeof d.reply !== 'string' || !d.reply.trim()) return { ok: false, reason: 'empty reply' };
        return { ok: true, reply: d.reply, navigate: d.navigate || null };
      } catch (e) {
        return { ok: false, reason: e && e.name === 'AbortError' ? 'timed out' : 'backend unreachable' };
      } finally { clearTimeout(timer); }

    const hbOfflineReply = (text, reason) => {

<script>
/* =====================================================================
   HYBILLS AI ADAPTER (preview only)
   Mounts the existing HybillsAI assistant (verbatim from the AI source customer.html) into this MVP.

   ===================================================================== */
(function () {
  const W = window;
  const phone = document.querySelector('.phone');
  if (!phone || W.HybillsAI) return;

  /* --- adapter: icons the AI panel uses that this MVP's icon set lacks (paths copied from the AI source) --- */
  const EXTRA_IC = {
    chat: '<path d="M4 5h16v11H9l-5 4z"/>',
    chevL: '<path d="M15 5l-7 7 7 7"/>',

  const baseIc = ic;
  const aiIc = (n, cls = '') => EXTRA_IC[n] ? `<svg class="ic ${cls}" viewBox="0 0 24 24">${EXTRA_IC[n]}</svg>` : baseIc(n, cls);

  /* --- adapter: navigation. The AI source navigates to screens this MVP names differently or does not have --- */
  const NAV_MAP = { trainBooking: 'train', hotelResults: 'hotels' };
  const aiNav = (name, params) => {

    const target = NAV_MAP[name] || name;

    App.nav(target, NAV_MAP[name] ? undefined : params);
  };

  /* --- the AI source object, verbatim, resolved against the adapter bindings below --- */
  (function (nav, ic) {
const HybillsAI = {
  mode: 'welcome',
  charState: 'idle', // 'idle' | 'listening' | 'thinking' | 'speaking' | 'happy' | 'sympathetic' | 'error' | 'yawning' | 'helpful'
  voiceState: 'idle', // 'idle' | 'listening' | 'thinking' | 'speaking'
  isMuted: false,
  isListening: false,
  recognition: null,
  stateTimeout: null,
  idleTimer: null,
  yawnTimeout: null,
  isYawning: false,
  messages: [
    { sender: 'bot', text: 'Hello! Welcome to Hybills. What can I help you do today? You can ask me to buy airtime, pay a bill, check your wallet, find a flight, book a hotel, or help you with anything available on Hybills.' }
  ],
  currentCaption: '',

  // Voice selection state
  _voiceSelected: null,
  _voicePromise: null,
  _voiceListeners: [],

  // Voice selection module: prefers female Nigerian English, falls back to best female English
  _selectVoice() {
    if (this._voiceSelected) return Promise.resolve(this._voiceSelected);
    if (this._voicePromise) return this._voicePromise;

    this._voicePromise = new Promise((resolve) => {
      const synth = window.speechSynthesis;
      if (!synth) {
        resolve(null);
        return;
      }

      const trySelect = () => {
        const voices = synth.getVoices();
        if (voices.length === 0) return false;

        // Priority 1: Female Nigerian English (en-NG)
        let selected = voices.find(v => 
          v.lang.toLowerCase().startsWith('en-ng') && 
          (v.name.toLowerCase().includes('female') || v.name.toLowerCase().includes('woman') || v.name.toLowerCase().includes('ezinne'))
        );

        // Priority 2: Any Nigerian English voice (may be male, but locale-correct)
        if (!selected) {
          selected = voices.find(v => v.lang.toLowerCase().startsWith('en-ng'));
        }

        // Priority 3: Female English voices from other regions (en-GB, en-US, en-ZA, en-AU, etc.)
        if (!selected) {
          const femaleEn = voices.filter(v => 
            v.lang.toLowerCase().startsWith('en-') &&
            (v.name.toLowerCase().includes('female') || 
             v.name.toLowerCase().includes('woman') ||
             v.name.toLowerCase().includes('samantha') ||
             v.name.toLowerCase().includes('victoria') ||
             v.name.toLowerCase().includes('karen') ||
             v.name.toLowerCase().includes('moira') ||
             v.name.toLowerCase().includes('tessa') ||
             v.name.toLowerCase().includes('susan') ||
             v.name.toLowerCase().includes('fiona') ||
             v.name.toLowerCase().includes('lisa') ||
             v.name.toLowerCase().includes('sarah') ||
             v.name.toLowerCase().includes('emily') ||
             v.name.toLowerCase().includes('amy') ||
             v.name.toLowerCase().includes('joanna') ||
             v.name.toLowerCase().includes('kimberly') ||
             v.name.toLowerCase().includes('kendra') ||
             v.name.toLowerCase().includes('ivy') ||
             v.name.toLowerCase().includes('nicole') ||
             v.name.toLowerCase().includes('allison'))
          );
          // Prefer en-GB, en-ZA (closer to Nigerian accent), then others
          femaleEn.sort((a, b) => {
            const score = (v) => {
              if (v.lang.toLowerCase().startsWith('en-gb')) return 3;
              if (v.lang.toLowerCase().startsWith('en-za')) return 2;
              if (v.lang.toLowerCase().startsWith('en-')) return 1;
              return 0;
            };
            return score(b) - score(a);
          });
          selected = femaleEn[0] || null;
        }

        // Priority 4: Any English voice as last resort
        if (!selected) {
          selected = voices.find(v => v.lang.toLowerCase().startsWith('en-')) || voices[0] || null;
        }

        if (selected) {
          this._voiceSelected = selected;
          this._voicePromise = null;
          resolve(selected);
          // Notify any listeners
          this._voiceListeners.forEach(cb => cb(selected));
          this._voiceListeners = [];
          return true;
        }
        return false;
      };

      // Try immediately
      if (trySelect()) return;

      // Wait for voices to load
      const onVoicesChanged = () => {
        if (trySelect()) {
          synth.onvoiceschanged = null;
        }
      };
      synth.onvoiceschanged = onVoicesChanged;

      // Safety timeout: give up after 3 seconds
      setTimeout(() => {
        if (!this._voiceSelected) {
          synth.onvoiceschanged = null;
          const voices = synth.getVoices();
          this._voiceSelected = voices.find(v => v.lang.toLowerCase().startsWith('en-')) || voices[0] || null;
          this._voicePromise = null;
          resolve(this._voiceSelected);
          this._voiceListeners.forEach(cb => cb(this._voiceSelected));
          this._voiceListeners = [];
        }
      }, 3000);
    });

    return this._voicePromise;
  },

  // Allow external callers to wait for voice selection
  onVoiceReady(cb) {
    if (this._voiceSelected) {
      cb(this._voiceSelected);
    } else {
      this._voiceListeners.push(cb);
      this._selectVoice();
    }
  },

  init() {
    this.updateCharacterDOM();
    const fab = document.getElementById('hbAiFab');
    if (fab) {
      fab.onclick = (e) => {
        e.stopPropagation();
        this.onUserInteraction();
        this.toggle();
      };
    }

    // Attach global user activity listeners for immediate yawn interruption & idle tracking
    const notifyActivity = () => this.onUserInteraction();
    window.addEventListener('pointerdown', notifyActivity, { passive: true });
    window.addEventListener('keydown', notifyActivity, { passive: true });
    window.addEventListener('touchstart', notifyActivity, { passive: true });

    this.resetIdleTimer();
  },

  onUserInteraction() {
    if (this.isYawning) {
      this.cancelYawn();
    }
    this.resetIdleTimer();
  },

  resetIdleTimer() {
    if (this.idleTimer) {
      clearTimeout(this.idleTimer);
      this.idleTimer = null;
    }
    // Only schedule yawning when resting in idle state and not busy
    if (this.charState === 'idle' && this.voiceState === 'idle' && !this.isListening) {
      this.idleTimer = setTimeout(() => {
        this.triggerYawn();
      }, 24000); // Trigger naturally after 24s of idle inactivity
    }
  },

  triggerYawn() {
    // Strict Guardrail: Never override active conversation, listening, thinking, speaking, or errors
    if (this.charState !== 'idle' || this.voiceState !== 'idle' || this.isListening) {
      return;
    }
    // Respect reduced motion accessibility
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      this.resetIdleTimer();
      return;
    }

    this.isYawning = true;
    this.setCharState('yawning');

    if (this.yawnTimeout) clearTimeout(this.yawnTimeout);
    this.yawnTimeout = setTimeout(() => {
      if (this.isYawning) {
        this.isYawning = false;
        this.yawnTimeout = null;
        if (this.charState === 'yawning') {
          this.setCharState('idle');
        }
        this.resetIdleTimer();
      }
    }, 3200); // 3.2s complete yawn cycle: droop, wide open, hold, sleepy blink, restore
  },

  cancelYawn() {
    if (this.yawnTimeout) {
      clearTimeout(this.yawnTimeout);
      this.yawnTimeout = null;
    }
    this.isYawning = false;
    if (this.charState === 'yawning') {
      this.charState = 'idle';
      this.updateCharacterDOM();
    }
  },

  setCharState(state, autoResetDurationMs = 0) {
    if (this.isYawning && state !== 'yawning') {
      this.cancelYawn();
    }
    this.charState = state;
    if (this.stateTimeout) {
      clearTimeout(this.stateTimeout);
      this.stateTimeout = null;
    }
    this.updateCharacterDOM();
    if (autoResetDurationMs > 0) {
      this.stateTimeout = setTimeout(() => {
        const isPanelOpen = document.getElementById('hbAiPanel')?.style.display === 'flex';
        this.setCharState(isPanelOpen ? (this.isListening ? 'listening' : 'idle') : 'idle');
        this.resetIdleTimer();
      }, autoResetDurationMs);
    } else if (state === 'idle') {
      this.resetIdleTimer();
    }
  },

  updateCharacterDOM() {
    const fab = document.getElementById('hbAiFab');
    if (!fab) return;
    fab.className = `hb-char-fab hb-char-state-${this.charState}`;
    if (!fab.querySelector('.hb-char-container')) {
      fab.innerHTML = `<div class="hb-char-container">${this.getCharSVG(44)}</div>`;
    }
    const heroChar = document.getElementById('hbHeroCharStage');
    if (heroChar) {
      heroChar.className = `hb-char-stage hb-char-state-${this.charState}`;
      heroChar.innerHTML = this.getCharSVG(86);
    }
  },

  toggle() {
    const panel = document.getElementById('hbAiPanel');
    if (panel && panel.style.display === 'flex') {
      this.close();
    } else {
      this.open();
    }
  },

  open() {
    this.onUserInteraction();
    const panel = document.getElementById('hbAiPanel');
    if (!panel) return;
    panel.style.display = 'flex';
    // Immediately become attentive
    this.setCharState('listening');
    this.render();
  },

  close() {
    this.stopSpeaking();
    this.stopListening();
    const panel = document.getElementById('hbAiPanel');
    if (panel) panel.style.display = 'none';
    this.setCharState('idle');
  },

  setMode(m) {
    this.onUserInteraction();
    this.mode = m;
    if (m === 'voice') {
      this.startVoiceExperience();
    } else {
      this.stopSpeaking();
      this.stopListening();
      this.setCharState('idle');
    }
    this.render();
  },

  initSpeechRecognition() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return null;
    try {
      const r = new SR();
      r.continuous = false;
      r.interimResults = true;
      r.lang = 'en-US';

      r.onstart = () => {
        this.onUserInteraction();
        this.isListening = true;
        this.voiceState = 'listening';
        this.setCharState('listening');
        this.currentCaption = 'Listening… speak now';
        this.render();
      };

      r.onresult = (e) => {
        this.onUserInteraction();
        // Barge-in: immediately cancel audio playback if speech activity is detected while speaking
        if (this.voiceState === 'speaking') {
          this.stopSpeaking();
          this.voiceState = 'listening';
          this.setCharState('listening');
        }
        let interim = '';
        let finalStr = '';
        for (let i = e.resultIndex; i < e.results.length; ++i) {
          if (e.results[i].isFinal) finalStr += e.results[i][0].transcript;
          else interim += e.results[i][0].transcript;
        }
        this.currentCaption = finalStr || interim || 'Listening…';
        this.render();
        
        // Buffer final transcripts and use endpointing to detect end of turn
        if (finalStr.trim()) {
          // Append to buffer (space-separated if buffer not empty)
          this._transcriptBuffer += (this._transcriptBuffer ? ' ' : '') + finalStr.trim();
          
          // Reset endpointing timer
          this._clearTranscriptTimer();
          this._transcriptTimer = setTimeout(() => {
            this._processBufferedTranscript();
          }, this._endpointingMs);
        }
      };

      r.onerror = (e) => {
        this.isListening = false;
        if (e.error === 'not-allowed') {
          this.currentCaption = 'Microphone permission blocked. Please allow mic in browser settings, or use Text mode.';
          this.setCharState('sympathetic', 4500);
        } else if (e.error === 'no-speech') {
          this.currentCaption = 'No speech detected. Tap Speak to try again.';
          this.setCharState('idle', 3000);
        } else {
          this.currentCaption = `Microphone notice (${e.error}). Tap Speak or use Text mode.`;
          this.setCharState('error', 3000);
        }
        this.voiceState = 'idle';
        this.render();
      };

      r.onend = () => {
        this.isListening = false;
        // Process any buffered transcript when recognition ends
        if (this._transcriptBuffer.trim()) {
          this._processBufferedTranscript();
        }
        if (this.voiceState === 'listening') {
          this.voiceState = 'idle';
          this.setCharState('idle');
          this.render();
        }
      };
      return r;
    } catch (err) {
      console.warn('SpeechRecognition init error:', err);
      return null;
    }
  },

  startListening() {
    this.onUserInteraction();
    this.stopSpeaking();
    // Clear transcript buffer for new listening session
    this._clearTranscriptTimer();
    this._transcriptBuffer = '';
    this._lastProcessedTranscript = '';
    if (!this.recognition) {
      this.recognition = this.initSpeechRecognition();
    }
    if (!this.recognition) {
      this.currentCaption = 'Native Speech recognition is not supported in this browser. Use Text mode or tap the prompts below.';
      this.voiceState = 'idle';
      this.render();
      return;
    }
    try {
      this.recognition.start();
    } catch (e) {
      try { this.recognition.stop(); } catch(x) {}
    }
  },

  stopListening() {
    this.onUserInteraction();
    // Clear any pending transcript processing
    this._clearTranscriptTimer();
    this._transcriptBuffer = '';
    if (this.recognition && this.isListening) {
      try { this.recognition.stop(); } catch (e) {}
    }
    this.isListening = false;
  },

  startVoiceExperience() {
    this.onUserInteraction();
    const speechText = "Hello! Welcome to Hybills. What can I help you do today? You can ask me to buy airtime, pay a bill, check your wallet, find a flight, book a hotel, or help you with anything available on Hybills.";
    this.currentCaption = speechText;
    this.voiceState = 'speaking';
    this.setCharState('speaking');
    this.render();
    this.speak(speechText, () => {
      this.voiceState = 'listening';
      this.setCharState('listening');
      this.render();
      this.startListening();
    });
  },

  numberToWords(n) {
    if (n === 0) return "zero";
    const ones = ["", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine",
      "ten", "eleven", "twelve", "thirteen", "fourteen", "fifteen", "sixteen",
      "seventeen", "eighteen", "nineteen"];
    const tens = ["", "", "twenty", "thirty", "forty", "fifty", "sixty", "seventy", "eighty", "ninety"];

    const convertBelowThousand = (num) => {
      if (num === 0) return "";
      if (num < 20) return ones[num];
      if (num < 100) {
        const t = tens[Math.floor(num / 10)];
        const rem = num % 10;
        return rem ? `${t}-${ones[rem]}` : t;
      }
      const h = `${ones[Math.floor(num / 100)]} hundred`;
      const rem = num % 100;
      if (rem === 0) return h;
      if (rem < 20) return `${h} and ${ones[rem]}`;
      const t = tens[Math.floor(rem / 10)];
      const r = rem % 10;
      const remStr = r ? `${t}-${ones[r]}` : t;
      return `${h} and ${remStr}`;
    };

    const parts = [];
    const billions = Math.floor(n / 1000000000);
    let rem = n % 1000000000;
    if (billions) parts.push(`${convertBelowThousand(billions)} billion`);

    const millions = Math.floor(rem / 1000000);
    rem = rem % 1000000;
    if (millions) parts.push(`${convertBelowThousand(millions)} million`);

    const thousands = Math.floor(rem / 1000);
    rem = rem % 1000;
    if (thousands) parts.push(`${convertBelowThousand(thousands)} thousand`);

    if (rem) {
      if (rem < 100 && (thousands > 0 || millions > 0 || billions > 0)) {
        parts.push(`and ${convertBelowThousand(rem)}`);
      } else {
        parts.push(convertBelowThousand(rem));
      }
    }

    return parts.join(" ").trim();
  },

  amountToNairaSpeech(amtNum, koboNum = 0) {
    const words = this.numberToWords(amtNum);
    if (koboNum > 0) {
      const koboWords = this.numberToWords(koboNum);
      return `${words} naira and ${koboWords} kobo`;
    }
    return `${words} naira`;
  },

  formatForSpeech(text) {
    if (!text || typeof text !== 'string') return '';
    let t = text;

    // 1. Normalize "Nigerian naira" / "Nigerian Naira" to "naira"
    t = t.replace(/\bNigerian\s+naira\b/gi, 'naira');

    // 2. Replace currency symbol occurrences (₦ or NGN) followed by numeric amount
    // Matches ₦1,000, ₦14,500, ₦145,000, NGN 12,500, ₦500.50
    t = t.replace(/(?:₦|NGN)\s*(\d{1,3}(?:,\d{3})+|\d+)(?:\.(\d{1,2}))?/g, (match, amtStr, koboStr) => {
      const amt = parseInt(amtStr.replace(/,/g, ''), 10);
      const kobo = koboStr ? parseInt(koboStr, 10) : 0;
      if (isNaN(amt)) return match;
      return this.amountToNairaSpeech(amt, kobo);
    });

    // 3. Replace numeric amount followed by "naira" (e.g., "1,000 naira" -> "one thousand naira")
    t = t.replace(/\b(\d{1,3}(?:,\d{3})+|\d+)(?:\.(\d{1,2}))?\s+naira\b/gi, (match, amtStr, koboStr) => {
      const amt = parseInt(amtStr.replace(/,/g, ''), 10);
      const kobo = koboStr ? parseInt(koboStr, 10) : 0;
      if (isNaN(amt)) return match;
      return this.amountToNairaSpeech(amt, kobo);
    });

    // 4. Natural phrasing for rates like /night -> per night
    t = t.replace(/\/night\b/gi, ' per night');

    return t;
  },

  speakAmountTest(amt) {
    const written = `₦${amt.toLocaleString()}`;
    const spoken = this.amountToNairaSpeech(amt);
    this.currentCaption = `Testing amount: ${written} (Spoken: "${spoken}")`;
    this.messages.push({ sender: 'bot', text: `Sample price: ${written}.` });
    this.render();
    this.speak(`The amount is ${written}.`);
  },

  speak(text, onEnd) {
    this.onUserInteraction();
    if (this.isMuted) {
      if (onEnd) onEnd();
      return;
    }
    if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
      // Wait for voice selection, then speak
      this._selectVoice().then(selectedVoice => {
        try {
          window.speechSynthesis.cancel();
          window.speechSynthesis.resume();
        } catch (e) {}

        const spokenText = this.formatForSpeech(text);
        const u = new SpeechSynthesisUtterance(spokenText);
        u.rate = 1.0;
        u.pitch = 1.05;
        if (selectedVoice) {
          u.voice = selectedVoice;
          console.log('[HybillsAI] Speaking with voice:', selectedVoice.name, selectedVoice.lang);
        } else {
          console.warn('[HybillsAI] No voice available, using browser default');
        }
        window._activeSpeechUtterance = u;

        u.onstart = () => {
          this.voiceState = 'speaking';
          this.setCharState('speaking'); // triggers mouth talking animation!
          this.render();
        };
        u.onend = () => {
          window._activeSpeechUtterance = null;
          if (this.voiceState === 'speaking') {
            this.voiceState = 'idle';
            this.setCharState('idle');
            this.render();
          }
          if (onEnd) onEnd();
        };
        u.onerror = (err) => {
          window._activeSpeechUtterance = null;
          if (this.voiceState === 'speaking') {
            this.voiceState = 'idle';
            this.setCharState('idle');
            this.render();
          }
          if (onEnd) onEnd();
        };

        try {
          window.speechSynthesis.speak(u);
        } catch (e) {
          window._activeSpeechUtterance = null;
          if (onEnd) setTimeout(onEnd, 2500);
        }
      }).catch(err => {
        console.error('[HybillsAI] Voice selection failed:', err);
        if (onEnd) onEnd();
      });
    } else {
      if (onEnd) setTimeout(onEnd, 2500);
    }
  },

  stopSpeaking() {
    this.onUserInteraction();
    if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
      try { window.speechSynthesis.cancel(); } catch (e) {}
    }
    window._activeSpeechUtterance = null;
    if (this.voiceState === 'speaking') {
      this.voiceState = 'idle';
      this.setCharState('idle');
      this.render();
    }
  },

  interruptSpeech() {
    this.onUserInteraction();
    if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
      try { window.speechSynthesis.cancel(); } catch (e) {}
    }
    window._activeSpeechUtterance = null;
    // Clear any pending transcript processing
    this._clearTranscriptTimer();
    this.voiceState = 'listening';
    this.setCharState('listening');
    this.currentCaption = 'Interrupted. Listening… speak now';
    this.render();
    this.startListening();
  },

  // Voice command processing pipeline with endpointing
  _transcriptBuffer: '',
  _transcriptTimer: null,
  _lastProcessedTranscript: '',
  _endpointingMs: 1000, // Silence timeout for end-of-turn detection

  _clearTranscriptTimer() {
    if (this._transcriptTimer) {
      clearTimeout(this._transcriptTimer);
      this._transcriptTimer = null;
    }
  },

  _isCompleteCommand(text) {
    const trimmed = text.trim().toLowerCase();
    // Too short to be a complete command (just "open", "go", etc.)
    if (trimmed.length < 3) return false;
    // Single word commands that are ambiguous
    const ambiguousWords = ['open', 'go', 'show', 'find', 'get', 'make', 'book', 'check', 'play', 'stop', 'start'];
    if (ambiguousWords.includes(trimmed)) return false;
    return true;
  },

  _processBufferedTranscript() {
    const transcript = this._transcriptBuffer.trim();
    this._transcriptBuffer = '';
    this._transcriptTimer = null;

    if (!transcript) return;

    // Deduplication: skip if identical to last processed
    if (transcript === this._lastProcessedTranscript) {
      return;
    }
    this._lastProcessedTranscript = transcript;

    // Validate command completeness
    if (!this._isCompleteCommand(transcript)) {
      // Ask for clarification instead of guessing
      const clarification = this._getClarificationPrompt(transcript);
      this.messages.push({ sender: 'user', text: transcript });
      this.currentCaption = `"${transcript}"`;
      this.voiceState = 'thinking';
      this.setCharState('thinking');
      this.render();
      this.speak(clarification, () => {
        this.voiceState = 'idle';
        this.setCharState('idle');
        this.render();
      });
      return;
    }

    // Process the complete command
    this.processUserInput(transcript, true);
  },

  _getClarificationPrompt(partial) {
    const p = partial.toLowerCase().trim();
    if (p === 'open' || p.startsWith('open ')) return 'What would you like me to open?';
    if (p === 'go' || p.startsWith('go ')) return 'Where would you like me to go?';
    if (p === 'show' || p.startsWith('show ')) return 'What would you like me to show?';
    if (p === 'find' || p.startsWith('find ')) return 'What would you like me to find?';
    if (p === 'book' || p.startsWith('book ')) return 'What would you like me to book?';
    if (p === 'check' || p.startsWith('check ')) return 'What would you like me to check?';
    return 'Could you please complete your request?';
  },

  toggleMute() {
    this.onUserInteraction();
    this.isMuted = !this.isMuted;
    if (this.isMuted) this.stopSpeaking();
    this.render();
  },

  async processUserInput(text, isVoice = false) {
    this.onUserInteraction();
    const trimmed = (text || '').trim();
    if (!trimmed) return;

    this.stopListening();
    this.stopSpeaking();
    this.messages.push({ sender: 'user', text: trimmed });
    this.currentCaption = `"${trimmed}"`;
    this.voiceState = 'thinking';
    this.setCharState('thinking');
    this.render();

    let reply = '';
    let navAction = null;

    // 1. Hotel intent detection across 36 Nigerian States + FCT
    if (/hotel|lodging|stay/i.test(trimmed)) {
      let state = 'Lagos', city = 'Lagos';
      if (/abuja/i.test(trimmed)) { state = 'FCT - Abuja'; city = 'Abuja'; }
      else if (/port harcourt|rivers/i.test(trimmed)) { state = 'Rivers'; city = 'Port Harcourt'; }
      else if (/kano/i.test(trimmed)) { state = 'Kano'; city = 'Kano'; }
      else if (/enugu/i.test(trimmed)) { state = 'Enugu'; city = 'Enugu'; }
      else if (/oyo|ibadan/i.test(trimmed)) { state = 'Oyo'; city = 'Ibadan'; }

      const matchHotels = DEMO.hotels.filter(h => h.state === state || h.city === city);
      if (matchHotels.length) {
        const hotelList = matchHotels.map(h => `${h.name} (${naira(h.price)}/night)`).join(' and ');
        reply = `I found ${matchHotels.length} verified hotels in ${city}, ${state}: ${hotelList}. Opening hotels screen for you to select dates and guests.`;
        navAction = () => {
          this.close();
          nav('hotelResults', { state, city, cin: today(7), nights: 1, guests: 2 });
        };
      } else {
        reply = `Our hotel directory covers all 36 Nigerian states and the FCT. Accommodations for ${state || 'that region'} are currently in the partner onboarding phase. Verified demo inventory is active in Lagos, Abuja, and Port Harcourt. Opening hotels for you now.`;
        navAction = () => {
          this.close();
          nav('hotelResults', { state: state || 'All', city: 'All', cin: today(7), nights: 1, guests: 2 });
        };
      }
    }
    // 1b. Data bundle intent ("Find my data bundle", "Take me to the data screen")
    else if (/data bundle|find my data|data screen|data plan|internet bundle|buy data/i.test(trimmed)) {
      reply = `Hybills offers daily and monthly data bundles across MTN, Airtel, Glo, and 9mobile starting from ₦500. Opening the Data screen for you now.`;
      navAction = () => {
        this.close();
        nav('data');
      };
    }
    // 1c. Call records intent ("Find call records")
    else if (/call record|call log|call history/i.test(trimmed)) {
      reply = `HyBills tracks your airtime and data purchases in your transaction history, but phone call records and cellular logs are managed directly by your cellular network carrier. Opening your Transactions so you can review airtime purchase history.`;
      navAction = () => {
        this.close();
        nav('wallet');
      };
    }
    // 1d. Go back intent ("Go back")
    else if (/^(go back|back)$/i.test(trimmed) || /navigate back|take me back/i.test(trimmed)) {
      reply = `Navigating back to the previous screen.`;
      navAction = () => {
        this.close();
        back();
      };
    }
    // 2. Airtime intent detection with prefill parameters
    else if (/airtime/i.test(trimmed)) {
      let net = 'mtn';
      let netName = 'MTN';
      if (/airtel/i.test(trimmed)) { net = 'airtel'; netName = 'Airtel'; }
      else if (/glo/i.test(trimmed)) { net = 'glo'; netName = 'Glo'; }
      else if (/9mobile/i.test(trimmed)) { net = '9mobile'; netName = '9mobile'; }

      let amt = 1000;
      const m = trimmed.match(/(\d[\d,]*)/);
      if (m) amt = parseInt(m[1].replace(/,/g, ''), 10) || 1000;

      reply = `Preparing ${netName} ₦${amt.toLocaleString()} airtime top-up. Opening the Airtime screen so you can review phone number and confirm.`;
      navAction = () => {
        this.close();
        nav('airtime', { net, amt });
      };
    }
    // 3. Wallet balance intent
    else if (/wallet|balance/i.test(trimmed)) {
      reply = `Your demo wallet balance is ${naira(S().cust.wallet)}. Would you like to fund your wallet?`;
      navAction = () => {
        this.close();
        nav('wallet');
      };
    }
    // 4. Difference between Train Ticket and Cowry Card
    else if (/difference between.*(train|cowry)|cowry.*(vs|versus|difference)|explain.*(train|cowry)/i.test(trimmed)) {
      reply = `Booking a train ticket reserves an assigned seat on NRC intercity trains like the Lagos–Ibadan or Abuja–Kaduna routes. In contrast, funding your Cowry card adds prepaid funds to your contactless transit card used for commuter transit on the Lagos Blue Line rail and BRT buses.`;
    }
    // 5. Cowry Card / Wallet Funding
    else if (/cowry|transit card|brt|blue line/i.test(trimmed)) {
      reply = `You can top up your Cowry contactless transit card directly from Hybills for Lagos Blue Line rail and BRT buses. Opening Cowry funding for you now.`;
      navAction = () => {
        this.close();
        nav('cowryFund');
      };
    }
    // 6. Train Booking (NRC)
    else if (/train|nrc|ebute metta|moniya|kaduna train/i.test(trimmed)) {
      reply = `We support Nigerian Railway Corporation (NRC) intercity train bookings between Lagos, Ibadan, Abuja, and Kaduna. Opening the Train booking service for you.`;
      navAction = () => {
        this.close();
        nav('trainBooking');
      };
    }
    // 7. Storefront and food inquiry (Grounded & Honest)
    else if (/yam|crunchies|food|groceries|snack|restaurant/i.test(trimmed)) {
      reply = `We do not currently have food items like yam or Crunchies in our store catalog. Hybills currently offers Electronics, Fashion, Home, and Beauty items. Would you like me to open the storefront for you?`;
    }
    else if (/shopfront|storefront|open store|browse store|products available in the shop|products in the shop|go to the shop|show me the products/i.test(trimmed) || /^(shop|store)$/i.test(trimmed)) {
      reply = `Opening the HyBills Storefront for you now to browse available items.`;
      navAction = () => {
        this.close();
        nav('store');
      };
    }
    // 8. Product Search
    else if (/search for this product|show me the available options|do they have|product/i.test(trimmed)) {
      if (/earbud|headphone/i.test(trimmed)) {
        reply = `Yes! We have Wireless Earbuds in Electronics for ₦12,500 with 45 units in stock. Opening the Store for you now.`;
        navAction = () => { this.close(); nav('store'); };
      } else if (/watch/i.test(trimmed)) {
        reply = `Yes! We have Smart Watches in Electronics for ₦45,000 with 20 units in stock. Opening the Store for you now.`;
        navAction = () => { this.close(); nav('store'); };
      } else if (/power bank|battery/i.test(trimmed)) {
        reply = `Yes! We have Power Bank 20k mAh in Electronics for ₦8,500 with 60 in stock. Opening the Store for you now.`;
        navAction = () => { this.close(); nav('store'); };
      } else if (/tote|bag|ankara/i.test(trimmed)) {
        reply = `Yes! We have handcrafted Ankara Totes in Fashion for ₦15,000 with 14 in stock. Opening the Store for you now.`;
        navAction = () => { this.close(); nav('store'); };
      } else if (/butter|shea|lotion/i.test(trimmed)) {
        reply = `Yes! We have Pure Shea Body Butter in Beauty for ₦4,500 with 80 in stock. Opening the Store for you now.`;
        navAction = () => { this.close(); nav('store'); };
      } else {
        reply = `Our storefront features Electronics, Fashion, Home goods, and Beauty products. Opening the Store for you to browse.`;
        navAction = () => { this.close(); nav('store'); };
      }
    }
    // 9. Flights inquiry (Domestic only)
    else if (/flight|airline|plane|fly|airport/i.test(trimmed)) {
      if (/london|uk|dubai|accra|international/i.test(trimmed)) {
        reply = `Hybills currently focuses exclusively on Nigerian domestic flights, such as Lagos, Abuja, Port Harcourt, and Kano. International routes are planned for a future release. Opening domestic flights for you.`;
      } else {
        reply = `Domestic flights are available across Nigeria between Lagos, Abuja, Port Harcourt, Kano, and Enugu with Air Peace and Ibom Air. Opening the flight search.`;
      }
      navAction = () => {
        this.close();
        nav('flights');
      };
    }
    // 10. Capabilities
    else if (/what can you do|what are your capabilities|help me find a service|what services/i.test(trimmed)) {
      reply = `Hybills helps you buy airtime and data, pay utility bills, book domestic Nigerian flights, reserve NRC train tickets, fund your Cowry transit card, book interstate buses, find hotels, and shop our store. Which service would you like to explore?`;
    }
    // 11. Follow-up intent resolution ("yes", "take me there", "open it", "show me")
    else if (/^(yes|yeah|sure|take me there|open it|go there|let's go|show me|open)/i.test(trimmed)) {
      const lastBot = this.messages.filter(m => m.sender === 'bot').slice(-1)[0]?.text?.toLowerCase() || '';
      if (lastBot.includes('store') || lastBot.includes('food') || lastBot.includes('product') || lastBot.includes('yam') || lastBot.includes('crunchies')) {
        reply = `Opening the HyBills Storefront for you now.`;
        navAction = () => { this.close(); nav('store'); };
      } else if (lastBot.includes('cowry')) {
        reply = `Opening Cowry card funding for you now.`;
        navAction = () => { this.close(); nav('cowryFund'); };
      } else if (lastBot.includes('train')) {
        reply = `Opening train ticket reservations for you now.`;
        navAction = () => { this.close(); nav('trainBooking'); };
      } else if (lastBot.includes('flight')) {
        reply = `Opening domestic flight search for you now.`;
        navAction = () => { this.close(); nav('flights'); };
      } else if (lastBot.includes('hotel')) {
        reply = `Opening hotel options for you now.`;
        navAction = () => { this.close(); nav('hotels'); };
      } else if (lastBot.includes('airtime')) {
        reply = `Opening airtime top up for you now.`;
        navAction = () => { this.close(); nav('airtime'); };
      } else {
        reply = `Opening the services catalog for you.`;
        navAction = () => { this.close(); nav('services'); };
      }
    }
    // 12. Conversational reasoning via /api/chat with full catalog
    else {
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: trimmed,
            history: this.messages.slice(-6),
            catalog: {
              wallet: S().cust.wallet,
              hotels: DEMO.hotels,
              networks: DEMO.networks,
              dataPlans: DEMO.dataPlans,
              products: DEMO.products.slice(0, 5)
            }
          })
        });
        if (res.ok) {
          const d = await res.json();
          reply = d.reply || "I can assist you with that service on Hybills.";
        } else {
          reply = "I can help with airtime, data, domestic flights, NRC trains, Cowry cards, hotels, or store orders on Hybills.";
        }
      } catch (err) {
        reply = "I'm ready to help you with airtime, data, domestic flights, NRC trains, Cowry cards, hotels, or checking your wallet.";
      }
    }

    this.messages.push({ sender: 'bot', text: reply });
    this.currentCaption = reply;
    this.render();

    if (isVoice && !this.isMuted) {
      this.speak(reply, () => {
        if (navAction) {
          setTimeout(navAction, 600);
        } else {
          this.voiceState = 'idle';
          this.setCharState('idle');
          this.render();
        }
      });
    } else {
      if (navAction) {
        setTimeout(navAction, 1200);
      } else {
        this.setCharState('helpful', 3000);
      }
    }

    const stream = document.getElementById('hbAiMsgStream');
    if (stream) stream.scrollTop = stream.scrollHeight;
  },
